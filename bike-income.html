<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bikes — AA Scooters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="nav.js" defer></script>
<style>
  :root{
    --sand:#F5EFE6;
    --ink:#1A2421;
    --petrol:#0F3D3E;
    --petrol-light:#175A5B;
    --cone:#FF6B35;
    --card:#FFFFFF;
    --line:#DED4C2;
    --muted:#5A6663;
    --ok:#2F855A;
    --bad:#C53030;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--sand); color:var(--ink);
    font-family:'Inter',sans-serif; min-height:100vh;
  }

  .page-head{ max-width:720px; margin:0 auto; padding:22px 16px 4px; }
  .page-head h1{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px;
    color:var(--petrol); margin:0;
  }
  .page-head .sub{ color:var(--muted); font-size:13px; margin-top:6px; line-height:1.5; }

  main{ max-width:720px; margin:0 auto; padding:16px 16px 60px; }

  .load-status{
    font-size:12px; color:#B36A2E; background:#FFF3E6; border:1px solid #F3D9B8;
    border-radius:7px; padding:7px 10px; margin-bottom:12px; display:none;
  }
  .load-status.show{ display:block; }

  .search-wrap{ margin-bottom:14px; }
  .search-wrap input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:var(--card); color:var(--ink);
  }
  .search-wrap input:focus{ outline:none; border-color:var(--petrol-light); }

  .toolbar{ margin-bottom:14px; }
  #toggleMonthsBtn{
    padding:9px 16px; border:1px solid var(--petrol); border-radius:8px;
    background:var(--card); color:var(--petrol); font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase;
    cursor:pointer;
  }
  #toggleMonthsBtn:active{ transform:scale(.97); }
  #toggleMonthsBtn.active{ background:var(--petrol); color:#fff; }

  .bike-count{ font-size:12px; color:var(--muted); margin-bottom:10px; }

  .table-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    overflow-x:auto;
  }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .month-col{ display:none; }
  table.show-months .month-col{ display:table-cell; }
  table.show-months{ min-width:900px; }
  thead th{
    background:var(--petrol); color:#fff; text-align:right; padding:9px 8px;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11.5px;
    letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
  }
  thead th:first-child{ text-align:left; }
  tbody td{
    padding:8px 8px; border-bottom:1px solid #F0EBE0; text-align:right; white-space:nowrap;
  }
  tbody td:first-child{ text-align:left; white-space:normal; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:nth-child(even){ background:#F3EEE3; }
  tbody tr.sold{ opacity:.55; }
  tbody tr.sold td:first-child{ text-decoration:line-through; }
  .sold-tag{
    display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--bad); background:#FCEBEB; border-radius:5px;
    padding:1px 5px; margin-left:6px; text-decoration:none; vertical-align:middle;
  }
  td.cost{ color:var(--muted); }
  td.expenses{ color:var(--bad); }
  /* Same bold Barlow Condensed treatment as .profit/.netProfit below --
     previously this was regular-weight Inter, which made the (correct,
     already dark) green read as washed-out/light next to the bold net
     profit figure in the same color. Bold weight reads as "darker" even
     at the same hex value, and this keeps income visually matched to
     net profit's green as requested. */
  td.income{ color:var(--ok); font-family:'Barlow Condensed',sans-serif; font-weight:700; }
  td.profit, td.netProfit{ font-family:'Barlow Condensed',sans-serif; font-weight:700; }
  td.netProfit.neg{ color:var(--bad); }
  td.netProfit.pos{ color:var(--ok); }

  tfoot td{
    padding:11px 8px; font-family:'Barlow Condensed',sans-serif; font-weight:700;
    background:var(--petrol); color:#fff; text-align:right;
  }
  tfoot td:first-child{ text-align:left; }

  .empty-hint{ font-size:13px; color:#8A948F; padding:14px 12px; }

  @media (min-width: 1000px){
    .page-head{ max-width:1400px; }
    main{ max-width:1400px; }
  }

  /* Shrink the base (non-month) columns on phones so all six columns --
     Bike, Cost, Income, Expenses, Profit, Net profit -- fit the screen
     width without side-scrolling. The "Show months" toggle already keeps
     the 12 month columns out of the way by default, so those never count
     against this. Cost used to be dropped below this width instead of
     shrunk; per explicit request it now always stays visible, so instead
     everything is packed tighter here: smaller font/padding, and the bike
     name column capped harder so a long name can't push the row wider
     than the screen. */
  @media (max-width:600px){
    .page-head{ padding:18px 12px 4px; }
    main{ padding:12px 12px 50px; }
    table{ font-size:11.5px; }
    thead th{ padding:6px 4px; font-size:10px; }
    tbody td{ padding:6px 4px; }
    tbody td:first-child{
      max-width:64px; overflow:hidden; text-overflow:ellipsis;
    }
  }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-head">
  <h1>Bikes</h1>
  <div class="sub">Income, expenses, profit, and net profit per bike — pulled live from the "bikes" sheet.</div>
</div>

<main>
  <div class="load-status" id="loadStatus"></div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search bikes…">
  </div>

  <div class="toolbar">
    <button type="button" id="toggleMonthsBtn">Show months</button>
  </div>

  <div class="bike-count" id="bikeCount"></div>

  <div class="table-wrap">
    <table id="bikesTable">
      <thead>
        <tr>
          <th>Bike</th>
          <th>Cost</th>
          <th class="month-col">Jan</th>
          <th class="month-col">Feb</th>
          <th class="month-col">Mar</th>
          <th class="month-col">Apr</th>
          <th class="month-col">May</th>
          <th class="month-col">Jun</th>
          <th class="month-col">Jul</th>
          <th class="month-col">Aug</th>
          <th class="month-col">Sep</th>
          <th class="month-col">Oct</th>
          <th class="month-col">Nov</th>
          <th class="month-col">Dec</th>
          <th>Income</th>
          <th>Expenses</th>
          <th>Profit</th>
          <th>Net profit</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot" style="display:none;">
        <tr>
          <td>Total</td>
          <td id="fCost"></td>
          <td class="month-col" id="fMonth0"></td>
          <td class="month-col" id="fMonth1"></td>
          <td class="month-col" id="fMonth2"></td>
          <td class="month-col" id="fMonth3"></td>
          <td class="month-col" id="fMonth4"></td>
          <td class="month-col" id="fMonth5"></td>
          <td class="month-col" id="fMonth6"></td>
          <td class="month-col" id="fMonth7"></td>
          <td class="month-col" id="fMonth8"></td>
          <td class="month-col" id="fMonth9"></td>
          <td class="month-col" id="fMonth10"></td>
          <td class="month-col" id="fMonth11"></td>
          <td id="fIncome"></td>
          <td id="fExpenses"></td>
          <td id="fProfit"></td>
          <td id="fNetProfit"></td>
        </tr>
      </tfoot>
    </table>
  </div>
</main>

<script>
const scriptUrl = ''; // DISCONNECTED: this Vercel copy is intentionally not wired to the live backend (dev/testing only, see project CLAUDE.md)

// ================== JSON-backed data layer (ported 13/08/2026) ==================
// Single read: action=bikeIncomeSummary (getBikeIncomeSummary) -- this page
// has no write actions at all. getBikeIncomeSummaryFromJson below is
// copied verbatim from add-bikes.html (same per-file convention).
//
// FIXED 2026-08-15: sold/soldAmount/soldDate/reason now come from the real
// `bikes_notes` sidecar (Add Bike's Sell/Write-off), same as every other
// page's sold-bike fix that same day -- this page's own copy of
// getBikeIncomeSummaryFromJson was simply missed from that pass (it wasn't
// in that fix's file list) even though add-bikes.html's identical copy
// already had it. The render()/CSS side (the "sold" row class + line-
// through name + "Sold" tag) was ALREADY fully built and just sitting
// unfed -- per Anton, a sold bike stays LISTED here (not hidden), just
// flagged, since its historical income is still real business data.
const bikeIncomeJsonCache = {};
function fetchSheetJson(sheetName, year) {
  const cacheKey = year ? `${year}/${sheetName}` : sheetName;
  const url = year
    ? `/api/data/${encodeURIComponent(sheetName)}?year=${encodeURIComponent(year)}`
    : `/api/data/${encodeURIComponent(sheetName)}`;
  if (!bikeIncomeJsonCache[cacheKey]) {
    bikeIncomeJsonCache[cacheKey] = fetch(url).then(r => {
      if (r.status === 401) throw new Error('Signed out -- please refresh to sign in again.');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(res => {
      if (!res.success) throw new Error(res.error || 'Could not load data.');
      return res.rows || [];
    }).catch(err => {
      // A cached PROMISE stays truthy whether it resolved or rejected --
      // clear the entry on failure so the next call actually retries
      // instead of replaying the same stale failure forever.
      delete bikeIncomeJsonCache[cacheKey];
      throw err;
    });
  }
  return bikeIncomeJsonCache[cacheKey];
}
function findHeaderColIdxJson(headerRow, exactLabel) {
  const target = exactLabel.toString().trim().toLowerCase();
  for (let c = 0; c < headerRow.length; c++) {
    const h = (headerRow[c] || '').toString().trim().toLowerCase();
    if (h === target) return c;
  }
  return -1;
}
function findBikesSheetMonthColIdxJson(headerRow, monthName) {
  const targetShort = monthName.toString().trim().toLowerCase().slice(0, 3);
  for (let c = 0; c < headerRow.length; c++) {
    const h = (headerRow[c] || '').toString().trim().toLowerCase();
    if (h && h.slice(0, 3) === targetShort) return c;
  }
  return -1;
}
function looksLikeBikesSheetLabelJson(raw) {
  const t = (raw || '').toString().trim().toLowerCase();
  if (!t) return true;
  if (t.indexOf('total') === 0) return true;
  if (t === 'expenses' || t === 'expense' || t.indexOf('expense %') === 0) return true;
  return false;
}
function normalizeBikeNameForTaxLookup(s) {
  return (s || '').toString().toLowerCase().replace(/[()]/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
}
// ---- action:'bikeIncomeSummary' -> getBikeIncomeSummaryFromJson ----
async function getBikeIncomeSummaryFromJson() {
  try {
    const rowsPromise = fetchSheetJson('bikes');
    const notesPromise = fetchSheetJson('bikes_notes').catch(() => []);
    const rows2D = await rowsPromise;
    const headerRow = rows2D[0] || [];
    const soldNoteRows = (await notesPromise) || [];
    const soldNoteByName = new Map();
    soldNoteRows.forEach(n => {
      const key = normalizeBikeNameForTaxLookup(n[0]);
      if (!key) return;
      try { soldNoteByName.set(key, JSON.parse(n[1])); } catch (e) { /* ignore unparseable note */ }
    });

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August',
      'September','October','November','December'];
    const monthCols = MONTH_NAMES
      .map(m => ({ label: m.slice(0, 3), col: findBikesSheetMonthColIdxJson(headerRow, m) }))
      .filter(m => m.col !== -1);

    const costCol = findHeaderColIdxJson(headerRow, 'cost');
    const incomeCol = findHeaderColIdxJson(headerRow, 'total');
    const expensesCol = findHeaderColIdxJson(headerRow, 'expenses');
    const profitCol = findHeaderColIdxJson(headerRow, 'profit');
    const netProfitCol = findHeaderColIdxJson(headerRow, 'net profit');

    const missingHeaders = [];
    if (costCol === -1) missingHeaders.push('cost');
    if (incomeCol === -1) missingHeaders.push('total');
    if (expensesCol === -1) missingHeaders.push('expenses');
    if (profitCol === -1) missingHeaders.push('profit');
    if (netProfitCol === -1) missingHeaders.push('net profit');
    if (missingHeaders.length) {
      throw new Error('Could not find a "' + missingHeaders.join('", "') + '" column header (row 1) on the "bikes" sheet.');
    }

    function num(v) { return (v === '' || v === null || v === undefined || isNaN(Number(v))) ? 0 : Number(v); }

    const bikes = [];
    for (let i = 1; i < rows2D.length; i++) {
      const row = rows2D[i];
      const name = (row[0] || '').toString().trim();
      if (!name) continue;
      if (looksLikeBikesSheetLabelJson(name)) break;

      const nameLower = name.toLowerCase();
      const isSentinel = (nameLower === 'extras' || nameLower === 'deposit');

      const soldNote = soldNoteByName.get(normalizeBikeNameForTaxLookup(name)) || null;
      const isSold = !!(soldNote && (soldNote.soldAmount || soldNote.reason));

      bikes.push({
        name,
        isSentinel,
        sold: isSold,
        soldAmount: (isSold && soldNote.soldAmount) ? Number(soldNote.soldAmount) : null,
        soldDate: (isSold && soldNote.soldDate) ? soldNote.soldDate : null,
        reason: (isSold && soldNote.reason) ? soldNote.reason : null,
        cost: num(row[costCol]),
        months: monthCols.map(mc => ({ label: mc.label, amount: num(row[mc.col]) })),
        income: num(row[incomeCol]),
        expenses: num(row[expensesCol]),
        profit: num(row[profitCol]),
        netProfit: num(row[netProfitCol])
      });
    }

    return { success: true, bikes };
  } catch (err) {
    return { success: false, error: err.message };
  }
}
// ================== end JSON-backed data layer ==================

let allBikes = [];

function setLoadStatus(msg) {
  const el = document.getElementById('loadStatus');
  if (!msg) { el.classList.remove('show'); el.textContent = ''; return; }
  el.textContent = msg;
  el.classList.add('show');
}

function fmt(num) {
  const n = Number(num) || 0;
  const sign = n < 0 ? '-' : '';
  // Whole baht only -- no cents in how this business tracks money, and
  // dropping ".00" off every figure frees up real width in this six-
  // column table (see the mobile font sizes below, bumped back up now
  // that the numbers themselves take less room).
  return sign + '฿' + Math.round(Math.abs(n)).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q ? allBikes.filter(b => b.name.toLowerCase().includes(q)) : allBikes;

  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot');
  const countEl = document.getElementById('bikeCount');

  countEl.textContent = filtered.length + ' bike' + (filtered.length === 1 ? '' : 's') +
    (q ? ' matching "' + q + '"' : '');

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="18" class="empty-hint">' +
      (allBikes.length ? 'No bikes match that search.' : 'No bikes found.') + '</td></tr>';
    tfoot.style.display = 'none';
    return;
  }

  tbody.innerHTML = filtered.map(b => {
    const netCls = b.netProfit < 0 ? 'neg' : (b.netProfit > 0 ? 'pos' : '');
    const months = b.months && b.months.length === 12 ? b.months : new Array(12).fill({ amount: 0 });
    const monthCells = months.map(m => `<td class="month-col">${fmt(m.amount)}</td>`).join('');
    return `<tr class="${b.sold ? 'sold' : ''}">
      <td>${b.name}${b.sold ? '<span class="sold-tag">Sold</span>' : ''}</td>
      <td class="cost">${fmt(b.cost)}</td>
      ${monthCells}
      <td class="income">${fmt(b.income)}</td>
      <td class="expenses">${fmt(b.expenses)}</td>
      <td class="profit">${fmt(b.profit)}</td>
      <td class="netProfit ${netCls}">${fmt(b.netProfit)}</td>
    </tr>`;
  }).join('');

  const sum = (key) => filtered.reduce((s, b) => s + (Number(b[key]) || 0), 0);
  document.getElementById('fCost').textContent = fmt(sum('cost'));
  for (let mi = 0; mi < 12; mi++) {
    const monthSum = filtered.reduce((s, b) => s + ((b.months && b.months[mi]) ? Number(b.months[mi].amount) || 0 : 0), 0);
    document.getElementById('fMonth' + mi).textContent = fmt(monthSum);
  }
  document.getElementById('fIncome').textContent = fmt(sum('income'));
  document.getElementById('fExpenses').textContent = fmt(sum('expenses'));
  document.getElementById('fProfit').textContent = fmt(sum('profit'));
  document.getElementById('fNetProfit').textContent = fmt(sum('netProfit'));
  tfoot.style.display = '';
}

// ---- Read-side stale-while-revalidate cache (ported from accounts.html's
// loadMonth() cache, 2026-08-16 rollout -- see PROGRESS.md "NEXT UP" entry).
// Pure read-only report page, no writes -- no invalidation call site needed. ----
const BIKE_INCOME_CACHE_KEY = 'aaBikeIncomeDataCache';
function readBikeIncomeCache() {
  try {
    const raw = localStorage.getItem(BIKE_INCOME_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.bikes)) return null;
    return parsed;
  } catch (e) { return null; }
}
function writeBikeIncomeCache(bikes) {
  try { localStorage.setItem(BIKE_INCOME_CACHE_KEY, JSON.stringify({ bikes, cachedAt: Date.now() })); } catch (e) {}
}
function timeAgoLabel(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  const m = Math.round(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  return h + 'h ago';
}

async function loadBikes() {
  const cached = readBikeIncomeCache();
  if (cached) {
    allBikes = cached.bikes;
    render();
    setLoadStatus('Showing saved data from ' + timeAgoLabel(cached.cachedAt) + ' — refreshing…');
  } else {
    setLoadStatus('Loading bikes…');
  }
  try {
    const res = await getBikeIncomeSummaryFromJson();
    if (!res.success) throw new Error(res.error || 'Could not load bike income data.');
    // Sold bikes (A-Z), then unsold bikes (A-Z), then "Extras" and
    // "Deposit" pinned to the very bottom in that fixed order -- those two
    // are sentinel rows on the sheet, not real bikes, so they never belong
    // mixed into an alphabetical group (see isSentinel on the backend).
    const sentinelOrder = ['extras', 'deposit'];
    allBikes = (res.bikes || []).slice().sort((a, b) => {
      const aSent = a.isSentinel ? sentinelOrder.indexOf(a.name.toLowerCase()) : -1;
      const bSent = b.isSentinel ? sentinelOrder.indexOf(b.name.toLowerCase()) : -1;
      if (!!a.isSentinel !== !!b.isSentinel) return a.isSentinel ? 1 : -1;
      if (a.isSentinel && b.isSentinel) return aSent - bSent;
      if (!!a.sold !== !!b.sold) return a.sold ? -1 : 1;
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    });
    setLoadStatus(null);
    render();
    writeBikeIncomeCache(allBikes);
  } catch (err) {
    if (cached) {
      setLoadStatus('Could not refresh (' + err.message + ') — showing saved data from ' + timeAgoLabel(cached.cachedAt) + '.');
    } else {
      setLoadStatus('Failed to load: ' + err.message);
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="18" class="empty-hint">Could not load bikes.</td></tr>';
    }
  }
}

document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('toggleMonthsBtn').addEventListener('click', () => {
  const table = document.getElementById('bikesTable');
  const btn = document.getElementById('toggleMonthsBtn');
  const showing = table.classList.toggle('show-months');
  btn.classList.toggle('active', showing);
  btn.textContent = showing ? 'Hide months' : 'Show months';
});

loadBikes();
</script>

</body>
</html>
