    const waLink = buildWhatsAppLink(renter.number);
    contactWaLinkBase = waLink;
    contactMessengerLinkBase = null;
    waLinkHtml = waLink
      ? `<div class="contact-wa-link"><a href="${waLink}?text=${encodeURIComponent(message)}" target="_blank" rel="noopener">Open WhatsApp chat ↗</a></div>`
      : '';
  }

  return `
    <div class="modal-backdrop show" id="contactBackdrop">
      <div class="modal-card">
        <h2 class="modal-title">Contact Customer</h2>
        ${renter.contact ? `<div class="contact-sub">Contact: ${renter.contact}</div>` : ''}
        <div class="contact-msg-box" id="contactMsgBox" contenteditable="true">${message}</div>
        ${waLinkHtml}
        ${messengerNoticeHtml}
        <div class="modal-actions">
          <button class="bc-btn close-contact" type="button">Close</button>
          <button class="bc-btn copy-contact" type="button">Copy</button>
        </div>
      </div>
    </div>
  `;
}

function renderContactModal() {
  const mount = document.getElementById('contactModalMount');
  if (mount) mount.innerHTML = contactModalHtml();
}

/* ---------------- QuickView modal ----------------
   A simple read-only table of every currently-rented bike -- the bike's
   model year, who it's rented to, their chat name (as a WhatsApp link),
   and the full rental span: the date the rental started ("Since") as
   well as when it's due back, so the total time on rent is visible at a
   glance rather than just the due date on its own. Deliberately NOT a
   separate page: it only ever exists as this overlay, opened by the
   "QuickView" button on this page, so there's no separate URL to link
   from nav.js or index.html (and nothing to accidentally expose there
   either).

   Below the table, a separate "Available" section (Anton, 20/07/2026)
   lists every bike NOT currently rented as small name+year chips that wrap
   left to right, not a second table, so it doesn't widen the modal.

   Deliberately kept to 4 columns (Bike, Renter, Rented, WhatsApp) so the
   whole table fits on one screen with no left/right scrolling -- the
   bike's model year is folded into the Bike cell as a small line under
   the name rather than its own column, and the rental's start date and
   due-back date are shown together as one "since -> due" range in a
   single Rented cell rather than two separate date columns. Paid and
   Deposit (Anton, 20/07/2026) are shown the same space-saving way: two
   more small sub-lines under the date range in that same Rented cell,
   NOT their own columns -- a 5th/6th column briefly existed but made the
   table too wide for mobile, forcing horizontal scrolling. The delivery-
   address link (also Anton, 20/07/2026) gets the same treatment under the
   WhatsApp cell instead, below the chat name -- previously lived under
   Rented, but that copy never actually rendered (Code.gs's data feed for
   this page never sent the link at all until this same date), so there
   was nothing working to preserve there.

   Sorting: the default listing (quickviewSortColumn === null) is soonest
   return date first, same as the original list view. Clicking a column
   header sorts by that column ascending; clicking the SAME header again
   reverses to descending. Clicking the Rented header from the default
   state re-produces the same soonest-first order (it's the same
   comparator, keyed on the due-back end of the range), so it reads as
   "back to normal" even though it's now tracked as an explicit sort.
   Sort state resets to the default every time the modal is (re)opened,
   per CLAUDE.md-style expectation that QuickView always opens the same
   way. */
let quickviewOpen = false;
let quickviewMouseDownOnBackdrop = false;
let quickviewSortColumn = null; // null | 'bike' | 'renter' | 'date' | 'contact'
let quickviewSortDirection = 'asc'; // 'asc' | 'desc' -- meaningless while column is null

const QUICKVIEW_COLUMNS = [
  { key: 'bike', label: 'Bike' },
  { key: 'renter', label: 'Renter' },
  { key: 'date', label: 'Rented' },
  // Header renamed from "WhatsApp" to "Contact" (Anton, 20/07/2026) --
  // this cell is meant to grow beyond just WhatsApp later (Messenger,
  // Facebook, etc.), so the generic label matches sooner rather than
  // needing another rename then. The column key stays 'contact' to match.
  { key: 'contact', label: 'Contact' },
];

// ---- Small icon per contact channel, keyed by type -- only 'whatsapp'
// exists today (every chat name/number on file is assumed to be WhatsApp),
// but Anton's flagged more channels (Messenger, Facebook) coming later, so
// this is a lookup to extend rather than an inline literal to duplicate
// once a real "channel" field exists per contact. Falls back to a generic
// chat bubble emoji for anything unrecognized -- a real icon can be added
// per-channel here the same way as WhatsApp's below once needed.
//
// WhatsApp's icon is a small inline SVG (a rounded green square with a
// white phone-handset glyph, in WhatsApp's actual brand green #25D366) --
// deliberately a clean redraw rather than a traced copy of the official
// logo artwork, since a plain 💬 emoji (the old placeholder here) reads as
// "generic chat", not specifically WhatsApp, which was the whole point
// Anton flagged (20/07/2026). ----
const CONTACT_TYPE_ICONS = {
  whatsapp: '<svg class="qv-contact-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="1" y="1" width="22" height="22" rx="6" fill="#25D366"/>' +
    '<path d="M8.6 6.4c.4-.4 1-.4 1.4.1l1.2 1.8c.3.4.3 1-.1 1.4l-.8.8c.6 1.3 1.7 2.4 3 3l.8-.8c.4-.4 1-.4 1.4-.1l1.8 1.2c.4.3.5 1 .1 1.4l-1 1.1c-.5.5-1.3.7-2 .5-2.6-.7-5.3-3.4-6-6-.2-.7 0-1.4.5-1.9z" fill="#fff"/>' +
    '</svg>',
  // Messenger's icon mirrors WhatsApp's shape (rounded square + simple
  // white glyph) so the two read as a matched pair, using Messenger's
  // actual brand blue #0084FF -- a plain speech-bubble glyph rather than
  // a traced copy of Meta's lightning-bolt logo, same "clean redraw" logic
  // as the WhatsApp icon above (added 20/07/2026 alongside Messenger
  // contact-method support).
  messenger: '<svg class="qv-contact-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="1" y="1" width="22" height="22" rx="6" fill="#0084FF"/>' +
    '<path d="M12 6c-3.6 0-6.5 2.6-6.5 6 0 1.9 1 3.6 2.5 4.7v2.1l2.3-1.3c.5.2 1.1.2 1.7.2 3.6 0 6.5-2.6 6.5-6S15.6 6 12 6z" fill="#fff"/>' +
    '</svg>'
};
function contactTypeIcon(type) {
  return CONTACT_TYPE_ICONS[(type || '').toString().trim().toLowerCase()] || '💬';
}

function openQuickView() {
  quickviewOpen = true;
  quickviewSortColumn = null;
  quickviewSortDirection = 'asc';
  renderQuickViewModal();
}

function closeQuickView() {
  quickviewOpen = false;
  renderQuickViewModal();
}

// Called when a QuickView column header is clicked. Same column clicked
// twice in a row flips direction; a different column starts fresh at
// ascending.
function handleQuickviewSort(column) {
  if (quickviewSortColumn === column) {
    quickviewSortDirection = (quickviewSortDirection === 'asc') ? 'desc' : 'asc';
  } else {
    quickviewSortColumn = column;
    quickviewSortDirection = 'asc';
  }
  renderQuickViewModal();
}

// Strips a leading honorific (Mr./Mrs./Ms./Miss/Dr./Mx./Master) so
// QuickView shows the person's actual name instead of "Mr." or "Miss."
// on its own. Handles honorifics glued directly onto the name (e.g.
// "Ms.Karina", as typed in some rows) as well as ones followed by a
// space (e.g. "Mr. Ding"). Falls back to 'Unknown' the same way the raw
// name does elsewhere on this page -- including when the only thing on
// file IS an honorific with no actual name typed after it.
const QUICKVIEW_HONORIFIC_RE = /^(mr|mrs|ms|miss|mister|dr|mx|master)\.?\s*/i;
function quickviewDisplayName(fullName) {
  const trimmed = (fullName || '').toString().trim();
  if (!trimmed) return 'Unknown';
  const stripped = trimmed.replace(QUICKVIEW_HONORIFIC_RE, '').trim();
  return stripped || 'Unknown';
}

// Model year for a bike, from the same Bike Tax lookup (categoryRows)
// used elsewhere on this page -- '' (not a number) when unknown, so
// callers can tell "no year on file" apart from an actual value.
function quickviewYearFor(bikeName) {
  const match = categoryRows.find(cr => bikeNamesMatch(cr.bike, bikeName));
  return match && match.modelYear ? match.modelYear : '';
}

// Compact "18 Jul" style date for the Rented column -- no weekday/year,
// unlike formatDateDisplay elsewhere on this page, since two of these
// have to fit side by side in one narrow table cell.
function quickviewShortDate(str) {
  const date = parseFlexibleDate(str);
  if (!date) return str || '—';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// Minimal escaping for dropping a pasted URL into an href/attribute --
// same characters Code.gs escapes when it builds the equivalent link for
// the calendar event description (see deliveryLinkHtml there).
function quickviewEscapeAttr(str) {
  return (str || '').toString()
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;');
}

function quickviewModalHtml() {
  if (!quickviewOpen) return '';

  // Same "current renter" lookup the main bike list uses, so QuickView
  // never disagrees with what's already shown on the page -- just a
  // different, denser presentation of the same rented bikes.
  const rentedRows = bikeNames
    .map(name => ({ name, renter: findCurrentRenter(name) }))
    .filter(row => !!row.renter);

  // Soonest return date first; a bike with no parseable return date sorts
  // to the end rather than disappearing. This is also exactly what the
  // 'date' column sort (ascending) produces, so the default view and an
  // explicit ascending Date sort are indistinguishable, as intended.
  rentedRows.sort((a, b) => {
    const da = parseFlexibleDate(a.renter.returnDate) || new Date(8640000000000000);
    const db = parseFlexibleDate(b.renter.returnDate) || new Date(8640000000000000);
    return da - db;
  });

  if (quickviewSortColumn) {
    const dir = (quickviewSortDirection === 'desc') ? -1 : 1;
    const collate = (x, y) => (x || '').localeCompare((y || ''), undefined, { sensitivity: 'base' });
    if (quickviewSortColumn === 'bike') {
      rentedRows.sort((a, b) => dir * collate(a.name, b.name));
    } else if (quickviewSortColumn === 'renter') {
      rentedRows.sort((a, b) => dir * collate(quickviewDisplayName(a.renter.name), quickviewDisplayName(b.renter.name)));
    } else if (quickviewSortColumn === 'contact') {
      rentedRows.sort((a, b) => dir * collate(a.renter.chatName, b.renter.chatName));
    } else if (quickviewSortColumn === 'date' && dir === -1) {
      // Ascending 'date' is already the list's natural order (sorted
      // above); only reverse it for the descending case.
      rentedRows.reverse();
    }
  }

  const headHtml = '<tr>' + QUICKVIEW_COLUMNS.map(col => {
    const isSorted = quickviewSortColumn === col.key;
    const arrow = isSorted ? (quickviewSortDirection === 'desc' ? ' <span class="qv-sort-arrow">▼</span>' : ' <span class="qv-sort-arrow">▲</span>') : '';
    return `<th class="qv-sort-th${isSorted ? ' qv-sorted' : ''}" data-qv-sort="${col.key}">${col.label}${arrow}</th>`;
  }).join('') + '</tr>';

  const bodyHtml = rentedRows.length
    ? rentedRows.map(row => {
        // Channel-aware: Messenger contacts get an m.me link + blue
        // Messenger icon, everyone else keeps the original WhatsApp
        // treatment (see renterContactChannel's comment for the fallback
        // logic when contactMethod is set but no messengerId was captured).
        // Link availability depends only on whether the resolved channel
        // has something to link to (a usable WhatsApp number, or a
        // Messenger username) -- NOT on whether a "chat name" happens to
        // be on file too. Previously this was gated on row.renter.chatName,
        // which silently hid the link for anyone with a Messenger username
        // set but no WhatsApp-era "chat name" ever entered -- e.g.
        // Christian Jay Verona, 20/07/2026 (see bikeCardHtml's identical
        // fix/comment above -- same root cause, two render paths). Falls
        // back to the generic "Chat" label when there's a link but no chat
        // name to show next to it.
        const waChannel = renterContactChannel(row.renter);
        const waLink = waChannel === 'messenger' ? buildMessengerLink(row.renter.messengerId) : buildWhatsAppLink(row.renter.number);
        const waLinkTitle = waChannel === 'messenger' ? 'Open Messenger chat' : 'Open WhatsApp chat';
        const waLabel = row.renter.chatName || 'Chat';
        const waIconHtml = (row.renter.chatName || waLink) ? `<span class="qv-contact-icon">${contactTypeIcon(waChannel)}</span>` : '';
        const waHtml = (!row.renter.chatName && !waLink)
          ? '<span class="qv-wa-none">—</span>'
          : (waLink
              ? `<a class="qv-wa-link" href="${waLink}" target="_blank" rel="noopener" title="${waLinkTitle}">${waIconHtml}${waLabel}</a>`
              : `<span class="qv-wa-none">${waIconHtml}${row.renter.chatName}</span>`);
        const year = quickviewYearFor(row.name);
        const yearHtml = year ? `<div class="qv-year-sub">${year}</div>` : '';
        const rentedRange = quickviewShortDate(row.renter.rentingDateFrom) + ' → ' + quickviewShortDate(row.renter.returnDate);
        // Total paid + deposit on file -- tucked under the date range in
        // this same Rented cell rather than their own columns, so the
        // table stays 4 columns wide (see this modal's header comment).
        const financeHtml = `<div class="qv-finance">💰 ${renterPaidDisplayHtml(row.renter)}</div><div class="qv-finance">🔒 ${renterDepositDisplayHtml(row.renter)}</div>`;
        // Delivery-address link -- only shown when this booking actually
        // has one on file (e.g. a walk-in pickup never does). Tucked under
        // the chat name in the Contact cell (Anton, 20/07/2026) rather than
        // its own column or under Rented, same space-saving treatment as
        // everything else in this table. Given its own noticeably bigger
        // top margin (.qv-delivery) and a scooter icon -- both stacked
        // links looked near-identical before, easy to tap the wrong one.
        const deliveryHtml = row.renter.deliveryLink
          ? `<div class="qv-delivery"><a href="${quickviewEscapeAttr(row.renter.deliveryLink)}" target="_blank" rel="noopener"><span class="qv-contact-icon">🛵</span>Delivery</a></div>`
          : '';
        return `
          <tr>
            <td class="qv-bike">${row.name}${yearHtml}</td>
            <td>${quickviewDisplayName(row.renter.name)}</td>
            <td class="qv-date">${rentedRange}${financeHtml}</td>
            <td>${waHtml}${deliveryHtml}</td>
          </tr>
        `;
      }).join('')
    : '';

  const tableOrEmpty = rentedRows.length
    ? `<div class="qv-table-wrap"><table class="qv-table"><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table></div>`
    : '<div class="qv-empty">No bikes are currently rented out.</div>';

  // ---- Available bikes -- everything NOT currently rented (same "current
  // renter" check the rest of this page uses), listed as a wrapping row of
  // small name+year chips rather than a table -- one row per bike would
  // make this section as tall as the fleet itself, and a 3rd table column
  // set would widen the modal right back into the mobile-scrolling problem
  // Paid/Deposit already hit once (see this modal's header comment). Bike
  // name only, year in small text right after it (from the same Bike Tax
  // lookup quickviewYearFor uses above) -- no other details, this is meant
  // as a quick "what's free right now" glance, not a second data table.
  const availableBikeNames = (bikeNames || []).filter(name => !findCurrentRenter(name));
  const availableHtml = availableBikeNames.length
    ? `<div class="qv-available">
         <div class="qv-available-title">Available (${availableBikeNames.length})</div>
         <div class="qv-available-list">${availableBikeNames.map(name => {
           const year = quickviewYearFor(name);
           return `<span class="qv-available-chip">${name}${year ? ` <span class="qv-available-year">${year}</span>` : ''}</span>`;
         }).join('')}</div>
       </div>`
    : `<div class="qv-available"><div class="qv-available-title">Available</div><div class="qv-empty">No bikes are currently available.</div></div>`;

  return `
    <div class="modal-backdrop show" id="quickviewBackdrop">
      <div class="modal-card qv-modal-card">
        <h2 class="modal-title">QuickView — Due Back</h2>
        ${tableOrEmpty}
        ${availableHtml}
        <div class="modal-actions">
          <button class="bc-btn close-quickview" type="button">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderQuickViewModal() {
  const mount = document.getElementById('quickviewModalMount');
  if (mount) mount.innerHTML = quickviewModalHtml();
}

function fallbackCopyText(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}

function copyContactMessage(btn) {
  const box = document.getElementById('contactMsgBox');
  if (!box) return;
  const text = box.textContent;
  const done = () => {
    btn.textContent = 'Copied!';
    clearTimeout(contactCopyResetTimer);
    contactCopyResetTimer = setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    // Messenger can't be pre-filled (see contactModalHtml's notice above),
    // so Copy doubles as "take me to the chat" for that channel only --
    // window.open (not location change) so the modal/page stays put
    // underneath the new tab, same as every other "open chat" link here.
    if (contactChannel === 'messenger' && contactMessengerLinkBase) {
      window.open(contactMessengerLinkBase, '_blank', 'noopener');
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopyText(text, done));
  } else {
    fallbackCopyText(text, done);
  }
}

function renderSwapModal() {

}

// New Bike autocomplete for the Swap modal -- same type-to-search pattern
// as the top search box (openAc/closeAc above) and contract.html's
// attachBikeModelAutocomplete, but written as delegated handlers rather
// than a one-time attach: swapModalHtml() rebuilds #swapNewBikeInput from
// scratch every renderSwapModal() call (e.g. on open/close, or after a
// failed Save), so an element reference grabbed once at page load would
// go stale. Options are recomputed from getAvailableBikeNames() on every
// keystroke rather than reusing a value baked in at render time, so the
// list can't go stale mid-edit either.
function closeSwapAc() {
  const list = document.getElementById('swapBikeAcList');
  if (!list) return;
  list.classList.remove('show');
  list.innerHTML = '';
  swapAcHiIndex = -1;
}

function openSwapAc(query) {
  const input = document.getElementById('swapNewBikeInput');
  const list = document.getElementById('swapBikeAcList');
  if (!input || !list) return;
  const renter = (customerRows || []).find(r => r.rowNumber === swapModalRowNumber);
  if (!renter) return;
  const available = getAvailableBikeNames(renter.bikeModel);
  const options = available.filter(n => tokenMatch(n, query)).slice(0, 8);
  if (!query || options.length === 0) { closeSwapAc(); return; }
  list.innerHTML = options.map((v, i) =>
    `<div class="ac-item" data-index="${i}">${highlight(v, query)}</div>`
  ).join('');
  list.classList.add('show');
  swapAcHiIndex = -1;
  Array.from(list.children).forEach((el, i) => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus in the input instead of losing it to the list item
      input.value = options[i];
      closeSwapAc();
    });
  });
  list._options = options;
}

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'swapNewBikeInput') openSwapAc(e.target.value.trim());
});

// 'focus' doesn't bubble, so delegation needs 'focusin' here (unlike the
// top search box's own one-time addEventListener('focus', ...)).
document.addEventListener('focusin', (e) => {
  if (e.target && e.target.id === 'swapNewBikeInput') openSwapAc(e.target.value.trim());
});

document.addEventListener('keydown', (e) => {
  if (!(e.target && e.target.id === 'swapNewBikeInput')) return;
  const list = document.getElementById('swapBikeAcList');
  if (!list) return;
  const items = Array.from(list.children);
  if (e.key === 'Enter') {
    e.preventDefault();
    if (swapAcHiIndex >= 0 && list._options) e.target.value = list._options[swapAcHiIndex];
    closeSwapAc();
    return;
  }
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    swapAcHiIndex = Math.min(swapAcHiIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('hi', i === swapAcHiIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    swapAcHiIndex = Math.max(swapAcHiIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('hi', i === swapAcHiIndex));
  } else if (e.key === 'Escape') {
    closeSwapAc();
  }
});

document.addEventListener('click', (e) => {
  const input = document.getElementById('swapNewBikeInput');
  const list = document.getElementById('swapBikeAcList');
  if (!input || !list) return;
  if (!input.contains(e.target) && !list.contains(e.target)) closeSwapAc();
});

function attemptSwapSave() {
  const renter = (customerRows || []).find(r => r.rowNumber === swapModalRowNumber);
  if (!renter) { closeSwapModal(); return; }

  const bikeInput = document.getElementById('swapNewBikeInput');
  const returnInput = document.getElementById('swapReturnAmountInput');
  const newBikeInput = document.getElementById('swapNewBikeAmountInput');
  const upgradeCheckbox = document.getElementById('swapUpgradeCheckbox');
  const addAmountInput = document.getElementById('swapAdditionalAmountInput');
  const addPaidByInput = document.getElementById('swapAdditionalPaidByInput');
  if (!bikeInput || !returnInput || !newBikeInput) return;

  const typedBike = (bikeInput.value || '').trim();
  const returnAmount = Number(returnInput.value);
  const newBikeAmount = Number(newBikeInput.value);
  const upgradeChecked = !!(upgradeCheckbox && upgradeCheckbox.checked);
  const additionalAmountRaw = addAmountInput ? addAmountInput.value : '';
  const additionalAmount = upgradeChecked ? Number(additionalAmountRaw) : 0;
  const additionalPaidBy = upgradeChecked ? (addPaidByInput ? addPaidByInput.value : '') : '';

  // Keep whatever the user typed, even if it turns out invalid below, so a
  // failed Save doesn't wipe out their edits.
  swapDraft = { newBike: typedBike, returnAmount, newBikeAmount, upgradeChecked, additionalAmount, additionalPaidBy };

  const available = getAvailableBikeNames(renter.bikeModel);
  const matchedBike = available.find(b => b.trim().toLowerCase() === typedBike.toLowerCase());

  if (!typedBike || !matchedBike) {
    swapError = 'Select a bike from the list of available bikes.';
    renderSwapModal();
    return;
  }
  if (returnInput.value === '' || newBikeInput.value === '' || isNaN(returnAmount) || isNaN(newBikeAmount) || returnAmount < 0 || newBikeAmount < 0) {
    swapError = 'Enter valid amounts (0 or more) for both the return and new bike.';
    renderSwapModal();
    return;
  }

  const total = Number(renter.totalPrice) || 0;
  const sum = returnAmount + newBikeAmount;
  if (Math.abs(sum - total) > 0.01) {
    swapError = `The two amounts must add up to the original total of ฿${fmtMoney(total)} — they currently add up to ฿${fmtMoney(sum)}.`;
    renderSwapModal();
    return;
  }

  // The upgrade/additional amount sits outside the balancing check above --
  // it's new money on top, not a reallocation of what's already been paid.
  if (upgradeChecked) {
    if (additionalAmountRaw === '' || isNaN(additionalAmount) || additionalAmount <= 0) {
      swapError = 'Enter a valid additional amount (more than 0), or untick the upgrade checkbox.';
      renderSwapModal();
      return;
    }
    if (!additionalPaidBy) {
      swapError = 'Select how the additional amount was paid.';
      renderSwapModal();
      return;
    }
  }

  // Normalize to the exact listed bike name/casing before sending to the server.
  swapDraft.newBike = matchedBike;
  swapError = '';
  swapStep = 'confirm';
  renderSwapModal();
}

// REWIRED 2026-08-17 onto the save-pipeline engine -- the modal closes
// immediately (optimistic) and the original row's card shows "Saving…"
// while the swap runs in the background, same as every other action on
// this page now.
function submitSwap() {
  const renter = (customerRows || []).find(r => r.rowNumber === swapModalRowNumber);
  if (!renter) { closeSwapModal(); return; }
  if (bkQueueFull()) { alert('2 saves are already in progress — wait for one to finish before starting another.'); return; }

  const rowNumber = swapModalRowNumber;
  const draft = swapDraft;
  closeSwapModal();

  bkEnqueue({
    label: (renter.name ? renter.name + ' — ' : '') + 'Swap bike',
    rows: [rowNumber],
    requests: [{
      action: 'swapBike',
      payload: {
        rowNumber: rowNumber,
        newBikeModel: draft.newBike,
        returnAmount: draft.returnAmount,
        newBikeAmount: draft.newBikeAmount,
        returnDate: todayIso(),
        additionalAmount: draft.upgradeChecked ? draft.additionalAmount : 0,
        additionalPaidBy: draft.upgradeChecked ? draft.additionalPaidBy : '',
        // clientTxnId generated once here so a dropped-connection retry
        // (or a page-reload resubmit) of this same request can't
        // double-swap -- see swapBikeFromJson's own comment in
        // lib/bikesWrites.js.
        clientTxnId: genClientTxnId()
      }
    }],
    onAllSuccess: (results) => {
      if (results[0].warning) alert('Swapped, but: ' + results[0].warning);
      // The swap touches two customer rows (this one closed out, plus a
      // brand-new one for the new bike) and the bikes sheet -- simplest to
      // just reload everything rather than try to patch the list in place.
      clearBikesCache(); loadData();
    }
  });
}

document.addEventListener('click', (e) => {
  const swapBtn = e.target.closest('.swap-btn');
  if (swapBtn) {
    openSwapModal(parseInt(swapBtn.dataset.row, 10));
    return;
  }
  const cancelSwapBtn = e.target.closest('.cancel-swap');
  if (cancelSwapBtn) {
    closeSwapModal();
    return;
  }
  const saveSwapBtn = e.target.closest('.save-swap');
  if (saveSwapBtn) {
    attemptSwapSave();
    return;
  }
  const backSwapBtn = e.target.closest('.cancel-swap-confirm');
  if (backSwapBtn) {
    swapStep = 'edit';
    swapError = '';
    renderSwapModal();
    return;
  }
  const confirmSwapBtn = e.target.closest('.confirm-swap-final');
  if (confirmSwapBtn) {
    submitSwap();
    return;
  }
  const contactBtn = e.target.closest('.contact-btn');
  if (contactBtn) {
    openContactModal(parseInt(contactBtn.dataset.row, 10));
    return;
  }
  const closeContactBtn = e.target.closest('.close-contact');
  if (closeContactBtn) {
    closeContactModal();
    return;
  }
  const quickViewBtn = e.target.closest('#quickViewBtn');
  if (quickViewBtn) {
    openQuickView();
    return;
  }
  const closeQuickviewBtn = e.target.closest('.close-quickview');
  if (closeQuickviewBtn) {
    closeQuickView();
    return;
  }
  const quickviewSortTh = e.target.closest('.qv-sort-th');
  if (quickviewSortTh) {
    handleQuickviewSort(quickviewSortTh.dataset.qvSort);
    return;
  }
  const copyContactBtn = e.target.closest('.copy-contact');
  if (copyContactBtn) {
    copyContactMessage(copyContactBtn);
    return;
  }
});

// Toggling the "Upgrade / additional amount" checkbox just shows/hides its
// fields directly (no renderSwapModal() call) -- re-rendering the whole
// modal here would wipe out anything already typed into the Return/New
// Bike amount fields, since those only get folded into swapDraft when Save
// is actually clicked. Direct show/hide keeps in-progress edits intact,
// same approach as the Extend form's "paid from deposit" toggle elsewhere
// on this page.
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'swapUpgradeCheckbox') {
    swapDraft.upgradeChecked = e.target.checked;
    const fields = document.getElementById('swapUpgradeFields');
    if (fields) fields.style.display = e.target.checked ? '' : 'none';
  }
});

// The Contact Customer message box is contenteditable (see
// contactModalHtml() above) so staff can tweak the wording before
// sending -- this keeps the "Open WhatsApp chat" link's pre-filled text
// in sync with whatever's actually in the box at click time, rather than
// the wording from when the modal opened.
document.addEventListener('input', (e) => {
  if (!(e.target && e.target.id === 'contactMsgBox')) return;
  if (!contactWaLinkBase) return; // no usable number -- link isn't shown at all
  const link = document.querySelector('.contact-wa-link a');
  if (!link) return;
  link.href = contactWaLinkBase + '?text=' + encodeURIComponent(e.target.textContent);
});

// Close only on a genuine click on the backdrop itself -- not when the
// mousedown started elsewhere (e.g. dragging to select text in one of the
// amount fields) and the mouseup happens to land on the backdrop. The
// backdrop element is recreated on every renderSwapModal() call, so this
// listens on the (stable) mount container and checks e.target instead of
// attaching directly to the backdrop -- same guard as accounts.html's
// modal and bikephotos.html's lightbox, just delegated. See CLAUDE.md.
const swapModalMount = document.getElementById('swapModalMount');
swapModalMount.addEventListener('mousedown', (e) => {
  swapMouseDownOnBackdrop = (e.target.id === 'swapBackdrop');
});
swapModalMount.addEventListener('click', (e) => {
  if (e.target.id === 'swapBackdrop' && swapMouseDownOnBackdrop) closeSwapModal();
  swapMouseDownOnBackdrop = false;
});

// Same guard as the Swap Bike modal above, for the Contact Customer
// modal's backdrop -- see CLAUDE.md.
const contactModalMount = document.getElementById('contactModalMount');
contactModalMount.addEventListener('mousedown', (e) => {
  contactMouseDownOnBackdrop = (e.target.id === 'contactBackdrop');
});
contactModalMount.addEventListener('click', (e) => {
  if (e.target.id === 'contactBackdrop' && contactMouseDownOnBackdrop) closeContactModal();
  contactMouseDownOnBackdrop = false;
});

// Same click-outside-to-close guard as the two modals above, for
// QuickView's backdrop -- see CLAUDE.md.
const quickviewModalMount = document.getElementById('quickviewModalMount');
quickviewModalMount.addEventListener('mousedown', (e) => {
  quickviewMouseDownOnBackdrop = (e.target.id === 'quickviewBackdrop');
});
quickviewModalMount.addEventListener('click', (e) => {
  if (e.target.id === 'quickviewBackdrop' && quickviewMouseDownOnBackdrop) closeQuickView();
  quickviewMouseDownOnBackdrop = false;
});

loadData();
restoreUnresolvedSaves(); // safe to run alongside loadData() -- see that function's own comment
</script>


<script>
/* ---- Date-in-words labels (shared across all pages) ----
   Every <input type="date"> gets a small red label right after it that
   writes the selected date out in words -- e.g. "8 July 2026" -- so a
   date like 08/07 can never be misread as August 7 (American style).
   You still pick the date in the box exactly as before; this only
   changes what's DISPLAYED, never what's saved to the sheet.
   Handles date boxes created later (e.g. the Return picker on Bikes
   Status) via a DOM observer, and values set by code (prefills,
   defaults) via a light polling loop. */
(function () {
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];

  function dateWords(iso) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(iso || '');
    if (!m) return '';
    var monthIdx = parseInt(m[2], 10) - 1;
    if (monthIdx < 0 || monthIdx > 11) return '';
    return parseInt(m[3], 10) + ' ' + MONTHS[monthIdx] + ' ' + parseInt(m[1], 10);
  }

  function ensureLabel(inp) {
    var el = inp.__dateWordsEl;
    if (el && el.parentNode) return el;
    el = document.createElement('span');
    el.className = 'date-words-label';
    el.style.cssText = 'display:inline-block;font-size:12.5px;font-weight:700;' +
      'color:#C62828;margin-top:3px;margin-left:2px;line-height:1.25;white-space:nowrap;';
    if (inp.nextSibling) {
      inp.parentNode.insertBefore(el, inp.nextSibling);
    } else {
      inp.parentNode.appendChild(el);
    }
    inp.__dateWordsEl = el;
    return el;
  }

  function refreshDateWordLabels() {
    var inputs = document.querySelectorAll('input[type="date"]');
    for (var i = 0; i < inputs.length; i++) {
      var inp = inputs[i];
      if (!inp.parentNode) continue;
      var el = ensureLabel(inp);
      var text = dateWords(inp.value);
      if (el.textContent !== text) el.textContent = text;
    }
  }

  // React immediately when the user picks/types a date.
  document.addEventListener('change', function (e) {
    if (e.target && e.target.type === 'date') refreshDateWordLabels();
  }, true);
  document.addEventListener('input', function (e) {
    if (e.target && e.target.type === 'date') refreshDateWordLabels();
  }, true);

  // Catch date boxes that get created after page load (re-rendered lists,
  // pop-up pickers). refreshDateWordLabels is idempotent, so the observer
  // re-firing on its own label insertions settles immediately.
  if (window.MutationObserver) {
    new MutationObserver(refreshDateWordLabels)
      .observe(document.documentElement, { childList: true, subtree: true });
  }

  // Catch values set by code (defaults, prefills from other pages), which
  // fire no events. A few date boxes at 2 checks/second costs nothing.
  setInterval(refreshDateWordLabels, 500);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', refreshDateWordLabels);
  } else {
    refreshDateWordLabels();
  }
})();
</script>
