// While a return/extend save is in flight, disable every button on the
// page -- not just the row's own Confirm button -- so a double-click (or
// clicking a different row's button mid-save) can't fire off a second
// write and create a duplicate entry. Only re-enables the buttons that
// were actually enabled before the save started; the row's own Confirm/
// Cancel buttons are separately re-rendered via render()'s isSaving logic.
function setAllButtonsDisabled(disabled) {
  document.querySelectorAll('button').forEach(b => {
    if (disabled) {
      if (!b.disabled) b.dataset.reenableAfterSave = '1';
      b.disabled = true;
    } else if (b.dataset.reenableAfterSave) {
      b.disabled = false;
      delete b.dataset.reenableAfterSave;
    }
  });
}

function todayIso() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function renterActionsHtml(renter) {
  const rowNumber = renter.rowNumber;

  // This row has an in-flight or queued background save (see the
  // save-pipeline engine above) -- show ONLY a small badge, no picker, no
  // per-field disabling. This replaces the old savingReturnRowNumber/
  // savingExtendRowNumber/savingEditTimeRowNumber single-scalar pattern
  // (which could only ever track ONE row "saving" at a time, page-wide) --
  // pendingRowSaves is a Map, so two different rows can independently be
  // mid-save at once, e.g. extending bike A and bike B together.
  const pendingHere = pendingRowSaves.get(rowNumber);
  if (pendingHere) {
    const isRunning = pendingHere.status === 'running';
    return `
      <div class="bc-actions">
        <span class="opt-row-badge${isRunning ? '' : ' queued'}">${isRunning ? '<span class="opt-spinner"></span> Saving…' : 'Queued…'}</span>
      </div>
    `;
  }
  // True once both queue slots (1 running + 1 waiting) are taken by OTHER
  // rows -- gates every write-committing button below (Confirm on any
  // picker, plus the Return/Extend/Swap/Adjust Pickup trigger buttons
  // further down) so a third write can't be started until one of the two
  // in-progress ones finishes. Contact Customer is exempt -- it doesn't
  // write anything.
  const writeBlocked = bkQueueFull();

  if (openReturnRowNumber === rowNumber) {
    // Reads from returnDepositTypeDisplay (kept up to date by
    // initReturnDepositLookup) rather than recomputing straight from
    // renter.deposit -- that field is often blank even when a real deposit
    // exists elsewhere (see that function's comment), and recomputing fresh
    // on every render() would reset an already-resolved label back to a

        </div>

        <input type="number" min="0" step="any" class="picker-input" id="returnDepositAmountInput-${rowNumber}" placeholder="Deposit amount to return (฿)">
        <div class="extend-note" id="returnDepositNote-${rowNumber}"></div>
        <div class="extend-month-row" id="returnCashToggleRow-${rowNumber}" style="display:none;">
          <input type="checkbox" id="returnCashToggle-${rowNumber}" ${returnCashToggleOpen[rowNumber] ? 'checked' : ''}>
          <label for="returnCashToggle-${rowNumber}">Return deposit in cash</label>
        </div>
        <input type="number" min="0" step="any" class="picker-input" id="returnDeductionsInput-${rowNumber}" placeholder="Deductions (฿)">
        <input type="text" class="picker-input" id="returnDeductionReasonInput-${rowNumber}" placeholder="Reason for deduction (if any)">
        <button class="bc-btn confirm-return" data-row="${rowNumber}" ${writeBlocked ? 'disabled title="2 saves already in progress — wait for one to finish"' : ''}>Confirm</button>
        <button class="bc-btn cancel-return" data-row="${rowNumber}">Cancel</button>
      </div>
    `;
  }

  if (openExtendRowNumber === rowNumber) {
    // Deal checkbox (Anton, 20/07/2026) -- only ever applies to a LONG
    // extension (1-month checkbox, or 30+ days), which closes this booking
    // out and opens a brand-new customer-sheet row for the extension
    // period, same as the Customer Record page's own "Add" form used to
    // handle before long extensions started submitting straight from here.
    // Deliberately NOT offered for a short, in-place extension -- see
    // refreshExtendDealVisibility, which shows/hides this row live as
    // staff type days or tick "Extend 1 month". Defaults to already-ticked
    // when this booking's current Contact-cell note already ends in
    // "Deal", so continuing an existing deal customer into their next
    // extension period doesn't require staff to remember to re-tick it.
    const renterIsDeal = /\bDeal\s*$/i.test((renter.contact || '').toString().trim());
    return `
      <div class="bc-actions bc-actions-picker">
        <div class="extend-datedays-row">
          <input type="date" class="picker-input" id="extendDateInput-${rowNumber}">
          <span class="or-label">or</span>

        </div>
        <div class="extend-price-breakdown" id="extendPriceBreakdown-${rowNumber}"></div>
        <input type="number" min="0" step="any" class="picker-input" id="extendAmountInput-${rowNumber}" placeholder="Amount paid (฿)">
        <select class="picker-input" id="extendPaidByInput-${rowNumber}">
          <option value="">Paid by…</option>
          <option value="cash">Cash</option>
          <option value="scan">QR Scan</option>
          <option value="wise">Wise</option>
          <option value="revolut">Revolut</option>
        </select>
        <div class="extend-month-row" id="extendDepositToggleRow-${rowNumber}" style="display:none;">
          <input type="checkbox" id="extendDepositToggle-${rowNumber}">
          <label for="extendDepositToggle-${rowNumber}">Paid from an existing deposit</label>
        </div>
        <select class="picker-input" id="extendDepositSelect-${rowNumber}" style="display:none;">
          <option value="">— Select —</option>
        </select>
        <div class="extend-month-row">
          <input type="checkbox" id="extendMonthCheckbox-${rowNumber}">
          <label for="extendMonthCheckbox-${rowNumber}">Extend 1 month</label>
        </div>
        <div class="extend-month-row" id="extendDealToggleRow-${rowNumber}" style="display:none;">
          <input type="checkbox" id="extendDealCheckbox-${rowNumber}" ${renterIsDeal ? 'checked' : ''}>
          <label for="extendDealCheckbox-${rowNumber}">Deal</label>
        </div>
        <div class="extend-note">1 month, or 30+ days, closes this booking out and starts a fresh rental record for the new period — the amount paid becomes that new record's total price. ("Paid from an existing deposit" above still applies to this too.)</div>
        <button class="bc-btn confirm-extend" data-row="${rowNumber}" ${writeBlocked ? 'disabled title="2 saves already in progress — wait for one to finish"' : ''}>Confirm</button>
        <button class="bc-btn cancel-extend" data-row="${rowNumber}">Cancel</button>
      </div>
    `;
  }

  if (openEditTimeRowNumber === rowNumber) {
    // Defaults to whatever pickup date/time the calendar is currently
    // showing: the confirmed date if staff have already adjusted this
    // booking once, otherwise the original due date. Either way, this
    // popup only ever writes to the calendar-only confirmed-date column
    // -- never to the booking's actual due date.
    const defaultDate = parseFlexibleDate(renter.confirmedReturnDate) || parseFlexibleDate(renter.returnDate);
    const editDateValue = defaultDate ? toIsoDate(defaultDate) : todayIso();
    // Prefills from whichever of the two already-existing link fields has
    // something on file -- the Contract's own deliveryLink first (set at
    // intake via "Deliver to hotel"), falling back to this row's own
    // pickupLink (set via calendar.html's "Add/Change delivery/pickup
    // link" button) if that's the only one set. Blank if neither is.
    const editLinkValue = renter.deliveryLink || renter.pickupLink || '';
    return `
      <div class="bc-actions bc-actions-picker">
        <div class="extend-datedays-row">
          <input type="date" class="picker-input" id="editDateInput-${rowNumber}" value="${editDateValue}">
          <input type="time" class="picker-input" id="editTimeInput-${rowNumber}" value="${renter.returnTime || ''}">
        </div>
        <input type="url" class="picker-input" id="editLinkInput-${rowNumber}" value="${quickviewEscapeAttr(editLinkValue)}" placeholder="Delivery/pickup link (Google Maps, optional)">

        <button class="bc-btn confirm-edit-time" data-row="${rowNumber}" ${writeBlocked ? 'disabled title="2 saves already in progress — wait for one to finish"' : ''}>Confirm</button>
        <button class="bc-btn cancel-edit-time" data-row="${rowNumber}">Cancel</button>
      </div>
    `;
  }

  const wAttrs = writeBlocked ? 'disabled title="2 saves already in progress — wait for one to finish"' : '';
  return `
    <div class="bc-actions">
      <button class="bc-btn return-btn" data-row="${rowNumber}" ${wAttrs}>Return</button>
      <button class="bc-btn extend-btn" data-row="${rowNumber}" ${wAttrs}>Extend</button>
      <button class="bc-btn swap-btn" data-row="${rowNumber}" ${wAttrs}>Swap Bike</button>
      <button class="bc-btn edit-time-btn" data-row="${rowNumber}" ${wAttrs}>Adjust Pickup</button>
      <button class="bc-btn contact-btn" data-row="${rowNumber}">📩 Contact Customer</button>

}

function bikeCardHtml(name, renter, query) {
  const rented = !!renter;
  const cls = rented ? 'rented' : 'not-rented';
  const rowPendingCls = (rented && pendingRowSaves.has(renter.rowNumber)) ? ' opt-row-pending' : '';
  const dueLabel = rented ? getDueLabel(renter.returnDate) : null;

  // If we have both a chat name and a usable link for this renter's chat
  // channel, show the chat name as a clickable link that opens that chat
  // directly; otherwise fall back to the same plain, non-clickable text as
  // before (e.g. no chat name at all, or a chat name but nothing on file
  // to link with). Channel (WhatsApp vs Messenger) comes from
  // renterContactChannel -- see its comment for the fallback logic.
  const channel = rented ? renterContactChannel(renter) : 'whatsapp';
  const chatLink = rented
    ? (channel === 'messenger' ? buildMessengerLink(renter.messengerId) : buildWhatsAppLink(renter.number))
    : null;
  const chatLinkTitle = channel === 'messenger' ? 'Open Messenger chat' : 'Open WhatsApp chat';
  // Link availability depends only on whether the resolved channel actually
  // has something to link to (a usable WhatsApp number, or a Messenger
  // username) -- NOT on whether a "chat name" happens to be on file too.
  // Previously this whole thing was gated on renter.chatName, which
  // silently hid the chat link for anyone with a Messenger username set
  // but no WhatsApp-era "chat name" ever entered (that field predates
  // Messenger support and was never required for it) -- e.g. Christian Jay
  // Verona, 20/07/2026. Falls back to the generic "(chat)" label when
  // there's a link but no chat name to show alongside it.
  const chatNameHtml = (rented && (chatLink || renter.chatName))
    ? (chatLink
        ? ' <a class="bc-chatname" href="' + chatLink + '" target="_blank" rel="noopener" title="' + chatLinkTitle + '">' + (renter.chatName ? '(chat: ' + renter.chatName + ')' : '(chat)') + '</a>'
        : ' <span class="bc-chatname">(chat: ' + renter.chatName + ')</span>')
    : '';

  const renterLine = rented
    ? `<div class="bc-renter">🧑‍✈️ Rented to: <b>${renter.name || 'Unknown'}</b>${chatNameHtml}${renter.contact ? ' &nbsp;·&nbsp; ' + renter.contact : ''}</div>`
    : '';

  const dueBadge = dueLabel
    ? `<span class="due-badge ${dueLabel.cls}">${dueLabel.text}</span>`
    : '';

  const details = rented
    ? `<b>Due back:</b> ${formatDateDisplay(renter.returnDate)} ${dueBadge}`
    : `Not rented`;

  // Total paid + deposit on file -- both sourced (where possible) from the
  // matched Contract row via Code.gs's findContractFinancialsForCustomerRow_,
  // so this reflects the customer's whole rental (surviving swaps/
  // extensions), not just this one customer-sheet row's own leg amount.
  const financeLine = rented
    ? `<div class="bc-finance">💰 Paid: ${renterPaidDisplayHtml(renter)} &nbsp;·&nbsp; 🔒 Deposit: ${renterDepositDisplayHtml(renter)}</div>`
    : '';

  const actions = rented ? renterActionsHtml(renter) : '';

  return `
    <div class="bike-card ${cls}${rowPendingCls}">
      <div class="bc-top">
        <div class="bc-name">${highlight(name, query)}</div>
        <div class="bc-tag ${cls}">${rented ? 'Rented' : 'Not rented'}</div>
      </div>
      ${renterLine}
      <div class="bc-details">${details}</div>
      ${financeLine}
      ${actions}
    </div>
  `;
}

function render() {
  const listBox = document.getElementById('listBox');
  const countEl = document.getElementById('resultsCount');
  const query = document.getElementById('bikeSearch').value.trim();

  const matches = bikeNames
    .filter(name => tokenMatch(name, query))
    .map(name => {
      const renter = findCurrentRenter(name);
      const lastReturn = renter ? null : findLastReturn(name);
      return { name, renter, lastReturn };
    });

  // Rented bikes first, soonest due-back at the very top. Not-rented bikes
  // follow, most-recently-returned first; bikes with no rental history at
  // all go last, alphabetically.
  matches.sort((a, b) => {
    if (a.renter && b.renter) {
      const da = parseFlexibleDate(a.renter.returnDate) || new Date(8640000000000000);
      const db = parseFlexibleDate(b.renter.returnDate) || new Date(8640000000000000);
      return da - db;
    }
    if (a.renter && !b.renter) return -1;
    if (!a.renter && b.renter) return 1;

    const da = a.lastReturn ? parseFlexibleDate(a.lastReturn.returnDate) : null;
    const db = b.lastReturn ? parseFlexibleDate(b.lastReturn.returnDate) : null;
    if (da && db) return db - da;
    if (da && !db) return -1;
    if (!da && db) return 1;
    return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  });

  countEl.textContent = matches.length + (matches.length === 1 ? ' bike' : ' bikes');

  if (!matches.length) {
    listBox.innerHTML = '<div class="empty-hint">No matching bikes.</div>';
    return;
  }

  listBox.innerHTML = matches.map(m => bikeCardHtml(m.name, m.renter, query)).join('');
}

/* ---------------- Search box with live narrowing + autocomplete ---------------- */

const searchInput = document.getElementById('bikeSearch');
const acList = document.getElementById('bikeAcList');
let hiIndex = -1;

function closeAc() {
  acList.classList.remove('show');
  acList.innerHTML = '';
  hiIndex = -1;
}

function openAc(query) {
  const options = bikeNames.filter(n => tokenMatch(n, query)).slice(0, 8);
  if (!query || options.length === 0) { closeAc(); return; }
  acList.innerHTML = options.map((v, i) =>
    `<div class="ac-item" data-index="${i}">${highlight(v, query)}</div>`
  ).join('');
  acList.classList.add('show');
  hiIndex = -1;
  Array.from(acList.children).forEach((el, i) => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      searchInput.value = options[i];
      closeAc();
      render();
    });
  });
  acList._options = options;
}

searchInput.addEventListener('input', () => {
  openAc(searchInput.value.trim());
  render();
});

searchInput.addEventListener('focus', () => {
  openAc(searchInput.value.trim());
});

searchInput.addEventListener('keydown', (e) => {
  const items = Array.from(acList.children);
  if (e.key === 'Enter') {
    // Enter just confirms the current text as the filter (list is already
    // narrowed live) and closes the suggestion dropdown.
    e.preventDefault();
    if (hiIndex >= 0 && acList._options) {
      searchInput.value = acList._options[hiIndex];
    }
    closeAc();
    render();
    return;
  }
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    hiIndex = Math.min(hiIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('hi', i === hiIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    hiIndex = Math.max(hiIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('hi', i === hiIndex));
  } else if (e.key === 'Escape') {
    closeAc();
  }
});

document.addEventListener('click', (e) => {
  if (!searchInput.contains(e.target) && !acList.contains(e.target)) closeAc();
});

/* ---------------- Return button + inline date-picker ---------------- */

document.getElementById('listBox').addEventListener('click', (e) => {
  const returnBtn = e.target.closest('.return-btn');
  if (returnBtn) {
    openReturnRowNumber = parseInt(returnBtn.dataset.row, 10);
    delete returnEarlyToggleOpen[openReturnRowNumber];
    delete returnCashToggleOpen[openReturnRowNumber];
    openExtendRowNumber = null;
    openEditTimeRowNumber = null;
    render();
    initReturnDepositLookup(openReturnRowNumber);
    return;
  }

  const cancelBtn = e.target.closest('.cancel-return');
  if (cancelBtn) {
    delete returnDepositMatches[openReturnRowNumber];
    delete returnDepositTypeDisplay[openReturnRowNumber];
    delete returnEarlyToggleOpen[openReturnRowNumber];
    delete returnCashToggleOpen[openReturnRowNumber];
    openReturnRowNumber = null;
    render();
    return;
  }

  const confirmBtn = e.target.closest('.confirm-return');
  if (confirmBtn) {
    const rowNumber = parseInt(confirmBtn.dataset.row, 10);
    const input = document.getElementById('returnDateInput-' + rowNumber);
    const isoDate = input ? input.value : '';
    if (!isoDate) {
      alert('Pick a date first.');
      return;
    }

    const deductionInput = document.getElementById('returnDeductionsInput-' + rowNumber);
    const reasonInput = document.getElementById('returnDeductionReasonInput-' + rowNumber);
    const deductionRaw = deductionInput ? deductionInput.value.trim() : '';
    const deductionAmount = deductionRaw === '' ? 0 : parseFloat(deductionRaw);
    const reason = reasonInput ? reasonInput.value.trim() : '';
    const depositMatch = returnDepositMatches[rowNumber] || null;

    if (isNaN(deductionAmount) || deductionAmount < 0) {
      alert('Enter a valid deduction amount.');
      return;
    }
    if (deductionAmount > 0 && !depositMatch) {
      alert('There\'s no deposit on file to deduct from — clear the deduction amount, or fix the deposit match above first.');
      return;
    }
    if (deductionAmount > 0 && !reason) {
      alert('Enter a reason for the deduction.');
      return;
    }

    // "Return deposit in cash" -- only ever actionable when it's actually
    // ticked AND not currently disabled (disabled means either it's not
    // eligible for this row -- no real non-cash deposit matched -- or the
    // deduction field has a value, see refreshReturnDeductionCashExclusivity).
    // Deliberately kept mutually exclusive with a deduction rather than
    // supporting both on the same return -- see that function's comment.
    const cashToggleEl = document.getElementById('returnCashToggle-' + rowNumber);
    const returnDepositAsCash = !!(cashToggleEl && !cashToggleEl.disabled && cashToggleEl.checked);
    if (returnDepositAsCash && deductionAmount > 0) {
      // Shouldn't be reachable through the UI (each field disables the
      // other), but guard it anyway rather than silently sending both.
      alert('Can\'t return the deposit in cash while a deduction is entered — clear one or the other.');
      return;
    }
    if (returnDepositAsCash && (!depositMatch || !depositMatch.amount)) {
      alert('No deposit amount on file to return as cash — check the deposit match above first.');
      return;
    }

    // Early return + refund -- a separate, independent piece from the
    // security-deposit deduction just validated above. Only read/validated
    // when the "Early return" box is actually ticked; unticked, this is
    // exactly the same normal-return call as before.
    const isEarlyReturn = !!returnEarlyToggleOpen[rowNumber];
    let refundAmount = 0;
    let refundPaidBy = '';
    if (isEarlyReturn) {
      const refundAmountInput = document.getElementById('returnRefundAmountInput-' + rowNumber);
      const refundPaidByInput = document.getElementById('returnRefundPaidByInput-' + rowNumber);
      const refundRaw = refundAmountInput ? refundAmountInput.value.trim() : '';
      refundAmount = refundRaw === '' ? 0 : parseFloat(refundRaw);
      refundPaidBy = refundPaidByInput ? refundPaidByInput.value : '';
      if (isNaN(refundAmount) || refundAmount < 0) {
        alert('Enter a valid refund amount (0 or more).');
        return;
      }
      if (refundAmount > 0 && !refundPaidBy) {
        alert('Select how the refund was paid.');
        return;
      }
    }

    confirmReturn(rowNumber, isoDate, depositMatch, deductionAmount, reason, isEarlyReturn, refundAmount, refundPaidBy, returnDepositAsCash);
    return;
  }

  const extendBtn = e.target.closest('.extend-btn');
  if (extendBtn) {
    openExtendRowNumber = parseInt(extendBtn.dataset.row, 10);
    extendAmountManuallyEditedRows.delete(openExtendRowNumber); // fresh popup, allow auto-fill again
    openReturnRowNumber = null;
    openEditTimeRowNumber = null;
    render();
    return;
  }

  const cancelExtendBtn = e.target.closest('.cancel-extend');
  if (cancelExtendBtn) {
    extendAmountManuallyEditedRows.delete(openExtendRowNumber);
    openExtendRowNumber = null;
    render();
    return;
  }

  const confirmExtendBtn = e.target.closest('.confirm-extend');
  if (confirmExtendBtn) {
    const rowNumber = parseInt(confirmExtendBtn.dataset.row, 10);
    const daysInput = document.getElementById('extendDaysInput-' + rowNumber);
    const amountInput = document.getElementById('extendAmountInput-' + rowNumber);
    const monthCheckbox = document.getElementById('extendMonthCheckbox-' + rowNumber);
    const paidByInput = document.getElementById('extendPaidByInput-' + rowNumber);
    const depositToggle = document.getElementById('extendDepositToggle-' + rowNumber);
    const depositSelect = document.getElementById('extendDepositSelect-' + rowNumber);
    const dealCheckbox = document.getElementById('extendDealCheckbox-' + rowNumber);
    const extendMonth = !!(monthCheckbox && monthCheckbox.checked);
    const days = daysInput ? parseInt(daysInput.value, 10) : NaN;
    const amountRaw = amountInput ? amountInput.value.trim() : '';
    const paidBy = paidByInput ? paidByInput.value : '';
    // A blank amount is treated as 0 rather than rejected — for long
    // extensions (checkbox, or 30+ days) a 0/blank amount gets auto-priced
    // below in confirmExtend() as a fallback, in case the live auto-fill
    // listeners didn't get a chance to run.
    const amount = amountRaw === '' ? 0 : parseFloat(amountRaw);
    // "Paid from an existing deposit" applies to both the short, in-place
    // extension and the long one -- it used to be discarded for a long
    // extension (that used to hand off to customers.html, which had its
    // own separate copy of this option), but a long extension now submits
    // directly from here too, so this same toggle covers it.
    const isLongExtension = extendMonth || (days >= 30);
    const paidFromDeposit = !!(depositToggle && depositToggle.checked);
    const depositCategory = paidFromDeposit ? depositCategoryForPaidBy(paidBy) : null;
    const depositRow = paidFromDeposit && depositSelect ? depositSelect.value : '';
    // Deal only ever applies to a long extension (Anton, 20/07/2026,
    // explicitly scoped out for short extensions) -- deliberately not read
    // at all outside this branch, so an unnoticed stale tick can never
    // affect a short, in-place extension.
    const isDeal = isLongExtension && !!(dealCheckbox && dealCheckbox.checked);
    // Days aren't needed when the "Extend 1 month" checkbox is ticked —
    // the checkbox alone determines the new due date in that case.
    if (!extendMonth && (!days || days <= 0)) {
      alert('Enter how many days to extend.');
      return;
    }
    if (isNaN(amount) || amount < 0) {
      alert('Enter the amount paid.');
      return;
    }
    if (!paidBy) {
      alert('Select how this extension was paid.');
      return;
    }
    if (paidFromDeposit && depositCategory !== 'cash' && !depositRow) {
      alert('Select which deposit this is being paid from.');
      return;
    }
    confirmExtend(rowNumber, days, amount, extendMonth, paidBy, paidFromDeposit, depositCategory, depositRow, isDeal);
    return;
  }

  const editTimeBtn = e.target.closest('.edit-time-btn');
  if (editTimeBtn) {
    openEditTimeRowNumber = parseInt(editTimeBtn.dataset.row, 10);
    openReturnRowNumber = null;
    openExtendRowNumber = null;
    render();
    return;
  }

  const cancelEditTimeBtn = e.target.closest('.cancel-edit-time');
  if (cancelEditTimeBtn) {
    openEditTimeRowNumber = null;
    render();
    return;
  }

  const confirmEditTimeBtn = e.target.closest('.confirm-edit-time');
  if (confirmEditTimeBtn) {
    const rowNumber = parseInt(confirmEditTimeBtn.dataset.row, 10);
    const dateInput = document.getElementById('editDateInput-' + rowNumber);
    const timeInput = document.getElementById('editTimeInput-' + rowNumber);
    const linkInput = document.getElementById('editLinkInput-' + rowNumber);
    const isoDate = dateInput ? dateInput.value : '';
    const hhmm = timeInput ? timeInput.value : '';
    const deliveryLink = linkInput ? linkInput.value.trim() : '';
    if (!isoDate) {
      alert('Pick a date first.');
      return;
    }
    if (!hhmm) {
      alert('Pick a time first.');
      return;
    }
    confirmEditTime(rowNumber, isoDate, hhmm, deliveryLink);
  }
});

// Parses an <input type="date">'s yyyy-MM-dd value into a local Date at
// midnight -- deliberately NOT reusing parseFlexibleDate's generic
// `new Date(str)` fallback for this, since browsers parse a bare
// "yyyy-MM-dd" string as UTC midnight, which can land on the wrong local
// day depending on the device's timezone. Building the Date from its
// year/month/day parts directly sidesteps that entirely.
function parseIsoDateLocal(iso) {
  const m = String(iso || '').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
}

function extendCurrentDueDate(rowNumber) {
  const renter = (customerRows || []).find(r => r.rowNumber === rowNumber);
  return renter ? parseFlexibleDate(renter.returnDate) : null;
}

// The extend form's "Extend to" date and "Days" fields are two views of
// the same thing -- editing either one recomputes the other from the
// row's current due date, so staff can use whichever is more convenient
// in the moment without the two ever disagreeing about what's actually
// being requested. Whichever field's value confirmExtend() ends up
// reading (always the days field, today) is guaranteed correct either way.
function syncExtendDaysFromDate(rowNumber) {
  const dateInput = document.getElementById('extendDateInput-' + rowNumber);
  const daysInput = document.getElementById('extendDaysInput-' + rowNumber);
  if (!dateInput || !daysInput || !dateInput.value) return;

  const dueDate = extendCurrentDueDate(rowNumber);
  const picked = parseIsoDateLocal(dateInput.value);
  if (!dueDate || !picked) return;

  const days = Math.round((picked - dueDate) / 86400000);
  daysInput.value = days > 0 ? days : '';
  maybeAutofillExtendAmount(rowNumber);
}

function syncExtendDateFromDays(rowNumber) {
  const dateInput = document.getElementById('extendDateInput-' + rowNumber);
  const daysInput = document.getElementById('extendDaysInput-' + rowNumber);
  if (!dateInput || !daysInput) return;

  const days = parseInt(daysInput.value, 10);
  const dueDate = extendCurrentDueDate(rowNumber);
  if (!days || days <= 0 || !dueDate) return;

  const newDate = new Date(dueDate.getTime() + days * 86400000);
  dateInput.value = toIsoDate(newDate);
}

// Rows whose "Amount paid" field staff have typed into directly on the
// extend form -- once that happens, maybeAutofillExtendAmount() below
// stops touching that row's amount field so the manual figure sticks,
// until the popup is closed and reopened fresh (see the extend-btn and
// confirm-extend handlers, which clear a row out of this set).
let extendAmountManuallyEditedRows = new Set();

// Auto-fills the "Amount paid" field on the extend form, LIVE, every time
// the days field, the date field, or the "Extend 1 month" checkbox
// changes -- unless staff have already typed into the amount field
// themselves this time round, in which case it's left alone.
//
// Two different formulas apply, matching how staff actually price these:
//  - LONG extension (the "Extend 1 month" checkbox ticked, or 30+ days):
//    computeExtendPrice() quotes the extension period as a fresh booking
//    of its own, at its own proper tiered/monthly rate.
//  - SHORT extension (anything under 30 days): computeShortExtendPrice()
//    charges the daily rate this booking is already on, instead of
//    re-quoting the couple of extra days as their own mini-booking.
function maybeAutofillExtendAmount(rowNumber) {
  const daysInput = document.getElementById('extendDaysInput-' + rowNumber);
  const amountInput = document.getElementById('extendAmountInput-' + rowNumber);
  const monthCheckbox = document.getElementById('extendMonthCheckbox-' + rowNumber);
  if (!daysInput || !amountInput || !monthCheckbox) return;

  const extendMonth = monthCheckbox.checked;
  const days = parseInt(daysInput.value, 10);
  const renter = (customerRows || []).find(r => r.rowNumber === rowNumber);

  // The "X days × ฿Y/day = ฿Z" text line updates every time, regardless of
  // whether staff have manually overridden the amount field below -- it's
  // informational, showing what the formula says, even if a different
  // figure has been typed in by hand.
  updateExtendPriceBreakdown(rowNumber, renter, extendMonth, days);
  // Deal checkbox only ever applies to a long extension -- kept in sync
  // live with the exact same days/month-checkbox inputs that determine
  // isLongExtension below, via every path that can change them (typing
  // days, picking a date, or ticking "Extend 1 month" all funnel through
  // this function).
  refreshExtendDealVisibility(rowNumber);

  if (extendAmountManuallyEditedRows.has(rowNumber)) return; // staff already overrode the amount field this round
  if (!extendMonth && (!days || days <= 0)) return; // nothing to price yet
  if (!renter) return;

  const isLongExtension = extendMonth || (days >= 30);
  const price = isLongExtension
    ? computeExtendPrice(renter.bikeModel, extendMonth, days)
    : computeShortExtendPrice(renter, days);

  if (price != null) {
    amountInput.value = price;
  }
}

document.getElementById('listBox').addEventListener('input', (e) => {
  const daysEl = e.target.closest('[id^="extendDaysInput-"]');
  if (daysEl) {
    const rowNumber = parseInt(daysEl.id.replace('extendDaysInput-', ''), 10);
    syncExtendDateFromDays(rowNumber);
    maybeAutofillExtendAmount(rowNumber);
    return;
  }

  const dateEl = e.target.closest('[id^="extendDateInput-"]');
  if (dateEl) {
    syncExtendDaysFromDate(parseInt(dateEl.id.replace('extendDateInput-', ''), 10));
    return;
  }

  // Staff typing directly into the amount field is what marks it as a
  // manual override -- setting .value from maybeAutofillExtendAmount()
  // itself doesn't fire this 'input' event, so only a real keystroke here
  // stops the live auto-fill for this row.
  const amountEl = e.target.closest('[id^="extendAmountInput-"]');
  if (amountEl) {
    extendAmountManuallyEditedRows.add(parseInt(amountEl.id.replace('extendAmountInput-', ''), 10));
  }

  const deductionEl = e.target.closest('[id^="returnDeductionsInput-"]');
  if (deductionEl) {
    refreshReturnDeductionCashExclusivity(parseInt(deductionEl.id.replace('returnDeductionsInput-', ''), 10));
  }
});

document.getElementById('listBox').addEventListener('change', (e) => {
  const monthEl = e.target.closest('[id^="extendMonthCheckbox-"]');
  if (monthEl) {
    maybeAutofillExtendAmount(parseInt(monthEl.id.replace('extendMonthCheckbox-', ''), 10));
  }

  const paidByEl = e.target.closest('[id^="extendPaidByInput-"]');
  if (paidByEl) {
    refreshExtendPaidFromDepositUI(parseInt(paidByEl.id.replace('extendPaidByInput-', ''), 10));
  }

  const depositToggleEl = e.target.closest('[id^="extendDepositToggle-"]');
  if (depositToggleEl) {
    refreshExtendPaidFromDepositUI(parseInt(depositToggleEl.id.replace('extendDepositToggle-', ''), 10));
  }

  const earlyToggleEl = e.target.closest('[id^="returnEarlyToggle-"]');
  if (earlyToggleEl) {
    const rowNumber = parseInt(earlyToggleEl.id.replace('returnEarlyToggle-', ''), 10);
    returnEarlyToggleOpen[rowNumber] = earlyToggleEl.checked;
    refreshReturnEarlyUI(rowNumber);
  }

  const cashToggleEl = e.target.closest('[id^="returnCashToggle-"]');
  if (cashToggleEl) {
    const rowNumber = parseInt(cashToggleEl.id.replace('returnCashToggle-', ''), 10);
    returnCashToggleOpen[rowNumber] = cashToggleEl.checked;
    refreshReturnDeductionCashExclusivity(rowNumber);
  }
});

// Shows/hides the refund amount + paid-via fields under the Return popup's
// "Early return" checkbox -- toggles the container's style.display directly
// rather than calling render(), so any deposit/deduction values staff
// already typed elsewhere in the same popup aren't wiped out (same
// technique refreshExtendPaidFromDepositUI above already uses for its own
// deposit toggle).
function refreshReturnEarlyUI(rowNumber) {
  const fields = document.getElementById('returnEarlyFields-' + rowNumber);
  if (!fields) return;
  fields.style.display = returnEarlyToggleOpen[rowNumber] ? '' : 'none';
}

// ---- "Paid from an existing deposit" for the short (in-place) extend flow.
// Mirrors the same feature on accounts.html / customers.html: pick a
// payment method of scan/wise/revolut on the extend form and a checkbox
// appears letting staff draw the extension payment from an existing
// security deposit instead of a fresh cash transaction. Only applies to
// the short, in-place extension -- the long extension (1 month / 30+ days)
// hands off to customers.html, which has its own copy of this feature. ----
function money(n) {
  if (n === '' || n === null || n === undefined || isNaN(Number(n))) return '—';
  const num = Number(n);
  const sign = num < 0 ? '-' : '';
  return sign + '฿' + Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function depositCategoryForPaidBy(paidByVal) {
  const v = (paidByVal || '').toString().trim().toLowerCase();
  if (v === 'scan') return 'bank';
  if (v === 'wise') return 'wise';
  if (v === 'revolut') return 'revolut';
  // Anton, 13/08/2026: Cash deposits have no tracking-sheet row to pick
  // from (see deductCashDeposit in Code.gs) -- 'cash' isn't a
  // DEPOSIT_CATEGORIES key, it's a special marker refreshExtendPaidFromDepositUI
  // and the confirm-extend handler both check for, to skip the dropdown
  // and send this straight to the Contract-only deduction path.
  if (v === 'cash') return 'cash';
  return null;
}

// Category keys (as used in the deposits data / DEPOSIT_CATEGORIES in
// Code.gs) back to the label staff actually use for that payment method.
const DEPOSIT_CATEGORY_LABELS = { bank: 'Scan', wise: 'Wise', revolut: 'Revolut' };

function normalizePersonName(s) {
  return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
}

// ---- Auto-fills the deposit-return amount on the Return popup ----
// The customer row's own "deposit method" field (Cash/Scan/Wise/Revolut/
// Passport/blank) is often NOT reliable -- it can be blank even when a real
// security deposit for that person is sitting in the Wise/Revolut/Scan
// tracking table (e.g. it was never filled in on the intake form). So this
// only trusts that field for the two cases where no lookup makes sense at
// all (Cash -- nothing to look up; blank/Passport/anything unmapped -- go
// straight to searching by name instead of assuming there's nothing there):
//  - Cash: amount stays blank/disabled, nothing to look up.
//  - Scan/Wise/Revolut: search that ONE category's table for a name match
//    first (fast path, matches what's actually recorded for this booking).
//  - If that doesn't turn up exactly one match (including when the stored
//    method is blank, Passport, or anything else not in the three
//    categories): fall back to searching ALL THREE categories by name.
//    A single match there fills in the amount AND corrects the displayed
//    deposit type to whatever category it was actually found under.
// Zero or multiple matches (in either step) leave the amount blank with a
// note, rather than guess.
//
// Whenever exactly one deposit is matched (either step), its {category,
// row} is remembered in returnDepositMatches so Confirm knows exactly
// which sheet row to clear -- and whether there's a real deposit to
// deduct from at all -- without re-searching. Cleared/left unset in every
// other case (Cash, no match, multiple matches), so Confirm can tell "no
// deposit to touch" apart from "a deposit was found".
let returnDepositMatches = {};

// What the "Deposit type" label should actually show right now, per row --
// the single source of truth renterActionsHtml()'s template reads from
// (see its comment). Only ever set to "Loading…"/a corrected label when
// the customer row's own deposit field was blank to begin with; a booking
// with a real recorded method (Cash/Scan/Wise/Revolut/Passport) shows that
// immediately and this map is never touched for it.
let returnDepositTypeDisplay = {};

async function initReturnDepositLookup(rowNumber) {
  const renter = (customerRows || []).find(r => r.rowNumber === rowNumber);
  const amountInput = document.getElementById('returnDepositAmountInput-' + rowNumber);
  const note = document.getElementById('returnDepositNote-' + rowNumber);
  const typeLabel = document.getElementById('returnDepositTypeLabel-' + rowNumber);
  if (!renter || !amountInput || !note) return;

  amountInput.value = '';
  amountInput.disabled = false;
  note.textContent = '';
  // Reset any red/bold warning styling a previous open of this same row
  // may have applied (see the "untraceable Scan/Wise/Revolut deposit"
  // branch below) -- otherwise a plain, later note could be stranded in
  // red as if it were still an error.
  note.style.color = '';
  note.style.fontWeight = '';
  delete returnDepositMatches[rowNumber];
  // Cleared unconditionally on every fresh lookup, not just when blank --
  // otherwise a stale label from a previous open of this same row (e.g.
  // corrected to "Wise" last time) could linger and mask a freshly-loaded,
  // genuinely different renter.deposit value on this run.
  delete returnDepositTypeDisplay[rowNumber];
  // Same reasoning -- the "Return deposit in cash" checkbox only makes
  // sense against a freshly-matched, real non-cash deposit (see
  // refreshReturnCashToggleUI below), so hide/reset it on every fresh
  // lookup too rather than leaving a stale row-vs-match mismatch on screen.
  delete returnCashToggleOpen[rowNumber];
  refreshReturnCashToggleUI(rowNumber);

  const depositType = (renter.deposit || '').toString().trim();
  const depositTypeWasBlank = !depositType;

  // Nothing recorded on the booking itself -- show "Loading…" instead of
  // jumping straight to "No deposit on file", since the cross-category
  // search below might still find a real one (see this function's header
  // comment). Corrected to whatever's actually found once that resolves.
  if (depositTypeWasBlank) {
    returnDepositTypeDisplay[rowNumber] = 'Loading…';
    if (typeLabel) typeLabel.textContent = 'Loading…';
  }

  if (depositType.toLowerCase() === 'cash') {
    // Cash deposits are never logged in the Wise/Scan/Revolut tracking
    // sheet, so there's nothing to search for or clear -- but that doesn't
    // mean there's no deposit at all. Still register a match (row: null,
    // since there's no sheet row) so Confirm treats a Deduction entered
    // here as legitimate instead of blocking it with "no deposit on file".
    amountInput.disabled = true;
    note.textContent = 'Cash deposit — not tracked here. Any deduction below will be logged as cash income.';
    returnDepositMatches[rowNumber] = { category: 'cash', row: null };
    return;
  }

  const primaryCategory = depositCategoryForPaidBy(depositType);
  note.textContent = 'Looking up deposit…';

  let res;
  try {
    res = await getDepositsDataFromJson();
  } catch (err) {
    res = null;
  }
  // The Return popup may have been closed/re-opened on a different row
  // while this fetch was in flight -- bail out quietly rather than writing
  // into the wrong row's fields.
  if (openReturnRowNumber !== rowNumber || !document.getElementById('returnDepositAmountInput-' + rowNumber)) return;
  if (!res || !res.success) {
    note.textContent = 'Could not load deposits — enter amount manually.';
    if (depositTypeWasBlank) {
      returnDepositTypeDisplay[rowNumber] = 'Unknown';
      if (typeLabel) typeLabel.textContent = 'Unknown';
    }
    return;
  }

  const deposits = res.deposits || [];
  const target = normalizePersonName(renter.name);

  if (primaryCategory) {
    const inCategory = deposits.filter(d => d.category === primaryCategory && normalizePersonName(d.name) === target);
    if (inCategory.length === 1) {
      amountInput.value = inCategory[0].amount;
      note.textContent = 'Matched ' + depositType + ' deposit for ' + renter.name + ' — ' + money(inCategory[0].amount) + ' remaining.';
      returnDepositMatches[rowNumber] = { category: primaryCategory, row: inCategory[0].row, amount: Number(inCategory[0].amount) || 0 };
      refreshReturnCashToggleUI(rowNumber);
      return;
    }
    if (inCategory.length > 1) {
      note.textContent = 'Multiple matching ' + depositType + ' deposits found for ' + renter.name + ' — enter manually.';
      return;
    }
    // inCategory.length === 0 -- fall through to the cross-category search
    // below, in case it was actually logged under a different method.
  }

  const anyMatch = deposits.filter(d => normalizePersonName(d.name) === target);
  if (anyMatch.length === 1) {
    const match = anyMatch[0];
    const label = DEPOSIT_CATEGORY_LABELS[match.category] || match.category;
    returnDepositTypeDisplay[rowNumber] = label;
    if (typeLabel) typeLabel.textContent = label;
    amountInput.value = match.amount;
    note.textContent = (depositType ? 'No "' + depositType + '" match, but found' : 'Found') +
      ' a ' + label + ' deposit for ' + renter.name + ' — ' + money(match.amount) + ' remaining.';
    returnDepositMatches[rowNumber] = { category: match.category, row: match.row, amount: Number(match.amount) || 0 };
    refreshReturnCashToggleUI(rowNumber);
    return;
  }

  if (anyMatch.length > 1) {
    note.textContent = 'Multiple matching deposits found for ' + renter.name + ' across categories — enter manually.';
    if (depositTypeWasBlank) {
      returnDepositTypeDisplay[rowNumber] = 'Multiple possible matches';
      if (typeLabel) typeLabel.textContent = 'Multiple possible matches';
    }
    return;
  }

  // anyMatch.length === 0 from here on -- nothing tracked anywhere under
  // this name, in any category.
  if (!depositTypeWasBlank) {
    // A real deposit method WAS recorded on this booking (e.g. staff typed
    // "Scan") -- trust it and just report nothing turned up. Guessing from
    // the rental's own payment method below would second-guess a value
    // staff deliberately entered.
    amountInput.disabled = true;
    note.textContent = 'No deposit on file.';
    return;
  }

  // Nothing recorded on the booking's OWN deposit field, AND nothing
  // turned up searching by name either -- this is the common "staff never
  // bothered filling in the deposit-method dropdown for a cash deposit"
  // case. Rather than leave it at a flat "No deposit on file" (which reads
  // identically whether a deposit was ever taken at all), fall back to
  // whatever payment method the RENTAL ITSELF was paid by -- a separate,
  // almost-always-filled-in field -- as a best guess, so staff see e.g.
  // "Cash" instead of nothing. Cash is trusted as a guess and stays
  // editable (nothing is ever tracked for a cash deposit anyway, so there's
  // nothing to verify against -- see that branch below); a guessed
  // Scan/Wise/Revolut is treated very differently -- see the branch below,
  // which flags it as needing a human check instead of just letting staff
  // type an amount in by hand.
  const rentalPaidBy = (renter.paidBy || '').toString().trim();
  const rentalPaidByLower = rentalPaidBy.toLowerCase();

  if (rentalPaidByLower === 'cash') {
    returnDepositTypeDisplay[rowNumber] = 'Cash';
    if (typeLabel) typeLabel.textContent = 'Cash';
    amountInput.disabled = true;
    note.textContent = 'No deposit tracked — assumed Cash, based on how the rental itself was paid. Any deduction below will be logged as cash income.';
    returnDepositMatches[rowNumber] = { category: 'cash', row: null };
    return;
  }

  const fallbackCategory = depositCategoryForPaidBy(rentalPaidBy);
  if (fallbackCategory) {
    const label = DEPOSIT_CATEGORY_LABELS[fallbackCategory] || rentalPaidBy;
    returnDepositTypeDisplay[rowNumber] = label;
    if (typeLabel) typeLabel.textContent = label;
    // Anton, 21/07/2026: unlike Cash (genuinely never logged in the
    // Wise/Scan/Revolut tracking table, see the branch above -- nothing
    // to check there), a Scan/Wise/Revolut deposit SHOULD always be
    // traceable to a real row in that table. If it isn't, that's a data
    // problem, not something to paper over -- this used to silently
    // ASSUME a deposit existed here just because that's how the rental
    // itself happened to be paid, and let staff log a deduction against
    // it anyway (registering a match with row: null). That's exactly how
    // an untracked, unverifiable deduction could get logged as if it were
    // real. Now this stops and flags it instead: amountInput stays
    // disabled and no match is registered, so Confirm's own "no deposit
    // on file to deduct from" guard blocks any deduction here until a
    // human has actually checked.
    amountInput.disabled = true;
    note.style.color = '#C0392B';
    note.style.fontWeight = '600';
    note.textContent = '⚠️ No tracked ' + label + ' deposit found for ' + renter.name + ' in this month\'s records, ' +
      'under any category. This rental was paid by ' + label + ', so a real deposit here should be traceable — ' +
      'please check the Wise/Revolut/Scan deposit tables by hand before returning this bike, and correct it on ' +
      'the Contract page if it turns out to be missing or logged wrong.';
    return;
  }

  // Rental paidBy is blank or something unrecognized too -- no better
  // guess available than a flat "no deposit on file".
  amountInput.disabled = true;
  returnDepositTypeDisplay[rowNumber] = 'No deposit on file';
  if (typeLabel) typeLabel.textContent = 'No deposit on file';
  note.textContent = 'No deposit on file.';
}

// ---- Shows/hides the Return popup's "Return deposit in cash" checkbox --
// only ever offered against a real, matched Scan/Bank, Wise or Revolut
// deposit (a sheet row actually exists to clear -- see returnDepositMatches
// above). Never offered for a Cash deposit (already cash, nothing to
// convert) or when nothing's been matched yet/at all. Hiding it also resets
// its ticked state and unchecks the box, so a stale tick from a previous
// row/lookup can never survive into a case where it no longer applies. ----
function refreshReturnCashToggleUI(rowNumber) {
  const toggleRow = document.getElementById('returnCashToggleRow-' + rowNumber);
  if (!toggleRow) return;
  const match = returnDepositMatches[rowNumber];
  const eligible = !!(match && match.category && match.category !== 'cash' && match.row);
  toggleRow.style.display = eligible ? '' : 'none';
  if (!eligible) {
    returnCashToggleOpen[rowNumber] = false;
    const cb = document.getElementById('returnCashToggle-' + rowNumber);
    if (cb) cb.checked = false;
  }
  refreshReturnDeductionCashExclusivity(rowNumber);
}

// ---- Keeps "Return deposit in cash" and "Deductions" mutually exclusive
// (Anton, 22/07/2026): handling a deduction AND a cross-method cash return
// on the same deposit at once would need the full any-to-any split he
// deliberately asked not to build (see returnDeposit's design comment in
// Code.gs) -- so instead of supporting that, the UI just blocks combining
// the two. Whichever the user fills in first locks out the other field
// entirely (greyed out via disabled, not merely warned about), so there's
// no way to end up with both set at once:
//   - Deduction entered (> 0)  -> the cash checkbox is disabled (and
//     force-unticked, in case it was already ticked before the deduction
//     was typed).
//   - Cash checkbox ticked     -> the deduction + reason inputs are
//     disabled, so nothing can be typed into them while it's ticked.
// Clearing whichever one was set unlocks the other again. ----
function refreshReturnDeductionCashExclusivity(rowNumber) {
  const cashCb = document.getElementById('returnCashToggle-' + rowNumber);
  const deductionInput = document.getElementById('returnDeductionsInput-' + rowNumber);
  const reasonInput = document.getElementById('returnDeductionReasonInput-' + rowNumber);
  if (!cashCb || !deductionInput) return;
  if (cashCb.disabled) return; // isSaving, or not eligible -- leave render()'s own disabling alone

  const deductionRaw = deductionInput.value.trim();
  const deductionHasValue = deductionRaw !== '' && parseFloat(deductionRaw) > 0;
  if (deductionHasValue && cashCb.checked) {
    // Shouldn't be reachable (each branch below disables the other field
    // before this could happen), but if it ever is, deduction wins and the
    // stale cash tick is cleared rather than silently sending both.
    cashCb.checked = false;
    returnCashToggleOpen[rowNumber] = false;
  }

  cashCb.disabled = deductionHasValue;
  deductionInput.disabled = cashCb.checked;
  if (reasonInput) reasonInput.disabled = cashCb.checked;
}

async function populateExtendDepositSelect(rowNumber, categoryKey) {
  const select = document.getElementById('extendDepositSelect-' + rowNumber);
  if (!select) return;
  select.innerHTML = '<option value="">Loading…</option>';
  select.disabled = true;
  try {
    const res = await getDepositsDataFromJson();
    // The row may have been collapsed/re-rendered while this fetch was in
    // flight (extend cancelled, another row opened) -- bail out quietly.
    if (openExtendRowNumber !== rowNumber || !document.getElementById('extendDepositSelect-' + rowNumber)) return;
    if (!res.success) {
      select.innerHTML = '<option value="">— Could not load deposits —</option>';
      return;
    }
    const matches = (res.deposits || []).filter(d => d.category === categoryKey);
    if (!matches.length) {
      select.innerHTML = '<option value="">— No deposits available —</option>';
      return;
    }
    select.innerHTML = '<option value="">— Select —</option>' +
      matches.map(d => `<option value="${d.row}">${(d.name || '(no name)')} — ${money(d.amount)}</option>`).join('');
  } catch (err) {
    select.innerHTML = '<option value="">— Could not load deposits —</option>';
  } finally {
    if (openExtendRowNumber === rowNumber && document.getElementById('extendDepositSelect-' + rowNumber)) {
      select.disabled = false;
    }
  }
}

function refreshExtendPaidFromDepositUI(rowNumber) {
  const toggleRow = document.getElementById('extendDepositToggleRow-' + rowNumber);
  const toggleCheckbox = document.getElementById('extendDepositToggle-' + rowNumber);
  const select = document.getElementById('extendDepositSelect-' + rowNumber);
  const paidByInput = document.getElementById('extendPaidByInput-' + rowNumber);
  if (!toggleRow || !toggleCheckbox || !select || !paidByInput) return;

  const category = depositCategoryForPaidBy(paidByInput.value);
  if (!category) {
    toggleRow.style.display = 'none';
    toggleCheckbox.checked = false;
    select.style.display = 'none';
    select.disabled = true;
    select.innerHTML = '<option value="">— Select —</option>';
    return;
  }

  toggleRow.style.display = '';

  // Cash (Anton, 13/08/2026): no tracking-sheet rows to choose between --
  // Code.gs finds the customer's own Contract row by name automatically,
  // same as the Deposits page's Cash section already does -- so this
  // dropdown never applies here, checked or not.
  if (category === 'cash') {
    select.style.display = 'none';
    select.disabled = true;
    select.innerHTML = '<option value="">— Select —</option>';
    return;
  }

  if (toggleCheckbox.checked) {
    select.style.display = '';
    populateExtendDepositSelect(rowNumber, category);
  } else {
    select.style.display = 'none';
    select.disabled = true;
    select.innerHTML = '<option value="">— Select —</option>';
  }
}

// Shows/hides the Deal checkbox row live, exactly when this extend popup's
// current inputs would actually trigger a LONG extension (see confirmExtend's
// isLongExtension check -- kept in sync with that same rule here). Forces
// the checkbox back off whenever it's hidden, so toggling days back down
// under 30 (or unticking "Extend 1 month") can't leave a stale, invisible
// tick behind that would otherwise do nothing anyway once hidden -- see the
// confirm-extend handler, which only ever reads this checkbox inside its
// own isLongExtension branch.
function refreshExtendDealVisibility(rowNumber) {
  const toggleRow = document.getElementById('extendDealToggleRow-' + rowNumber);
  const toggleCheckbox = document.getElementById('extendDealCheckbox-' + rowNumber);
  const monthCheckbox = document.getElementById('extendMonthCheckbox-' + rowNumber);
  const daysInput = document.getElementById('extendDaysInput-' + rowNumber);
  if (!toggleRow || !toggleCheckbox || !monthCheckbox) return;

  const extendMonth = monthCheckbox.checked;
  const days = daysInput ? parseInt(daysInput.value, 10) : NaN;
  const isLongExtension = extendMonth || (days >= 30);

  if (isLongExtension) {
    toggleRow.style.display = '';
  } else {
    toggleRow.style.display = 'none';
    toggleCheckbox.checked = false;
  }
}

// REWIRED 2026-08-17 onto the save-pipeline engine above: the picker
// closes immediately (optimistic), the actual write(s) run in the
// background via bkEnqueue, and only THIS row shows the "Saving…" badge
// while it's in flight -- see pendingRowSaves/renterActionsHtml. A normal
// return (unticked) still sends 'markReturned'; an early return (ticked,
// refund or not) sends 'earlyReturnBike' -- see earlyReturnBikeFromJson's
// own comment in lib/bikesWrites.js for the full refund/ledger/Contract/
// bikes-sheet cascade that runs server-side in one round trip. If a
// deposit was matched, 'returnDeposit' runs as a SECOND request in the
// same queue item, same order as before this pass -- a problem there
// surfaces via the failure banner/review panel rather than rolling back
// the return (which, by that point, already succeeded).
function confirmReturn(rowNumber, isoDate, depositMatch, deductionAmount, reason, isEarlyReturn, refundAmount, refundPaidBy, returnDepositAsCash) {
  if (bkQueueFull()) { alert('2 saves are already in progress — wait for one to finish before starting another.'); return; }

  const row = (customerRows || []).find(r => r.rowNumber === rowNumber);

  const requests = [isEarlyReturn
    ? { action: 'earlyReturnBike', payload: { rowNumber: rowNumber, returnDate: isoDate, refundAmount: refundAmount, refundPaidBy: refundPaidBy, clientTxnId: genClientTxnId() } }
    : { action: 'markReturned', payload: { rowNumber: rowNumber, returnDate: isoDate, clientTxnId: genClientTxnId() } }];

  // Fires after the return itself has already succeeded -- clears the
  // matched security deposit entirely and, if a deduction was entered,
  // logs it as its own normal income entry (see the 'returnDeposit' action
  // in lib/bikesWrites.js for exactly what that does server-side). Only
  // added when a deposit was actually matched on this popup.
  if (depositMatch) {
    const depositBody = {
      category: depositMatch.category, row: depositMatch.row, deductionAmount: deductionAmount,
      reason: reason, customerName: row ? row.name : '', bikeModel: row ? row.bikeModel : '',
      clientTxnId: genClientTxnId()
    };
    // "Return deposit in cash" -- always the WHOLE matched deposit amount,
    // never split with a deduction (mutually exclusive in the UI, and
    // returnDepositAsCash is only ever true when deductionAmount is 0 --
    // see the confirm-return click handler).
    if (returnDepositAsCash && depositMatch.amount) {
      depositBody.returnedVia = 'cash';
      depositBody.returnedViaAmount = depositMatch.amount;
    }
    requests.push({ action: 'returnDeposit', payload: depositBody });
  }

  openReturnRowNumber = null;
  delete returnDepositMatches[rowNumber];
  delete returnDepositTypeDisplay[rowNumber];
  delete returnEarlyToggleOpen[rowNumber];
  delete returnCashToggleOpen[rowNumber];

  bkEnqueue({
    label: (row ? row.name + ' — ' : '') + (isEarlyReturn ? 'Early return' : 'Return'),
    rows: [rowNumber],
    requests,
    onStepSuccess: (stepIndex, result) => {
      if (stepIndex !== 0) return;
      // Post-write verification problems (the server re-reads what it
      // wrote and compares) come back as a warning -- the save DID go
      // through, but something should be checked by hand.
      if (result.warning) alert('Saved, but: ' + result.warning);
      // Both markReturned and earlyReturnBike touch this one customer
      // row's return date/time-color/situation the same way -- patched
      // locally the moment this step succeeds (not waiting on the
      // best-effort deposit follow-up, if any) so the underlying data is
      // correct as soon as it can be, even though the card itself keeps
      // showing "Saving…" until the whole item (including the deposit
      // step) resolves.
      const r2 = (customerRows || []).find(r => r.rowNumber === rowNumber);
      if (r2) { r2.returnDate = isoToDmy(isoDate); r2.situation = 'Returned'; }
    },
    onAllSuccess: (results) => {
      const depositWarning = results[1] && results[1].warning;
      if (depositWarning) alert('Deposit processed, but: ' + depositWarning);
      const r2 = (customerRows || []).find(r => r.rowNumber === rowNumber);
      if (!r2) { clearBikesCache(); loadData(); }
    }
  });
}

// Lets staff record the actual agreed pickup DATE & TIME on an active
// booking -- e.g. the intake form had a placeholder time, or the customer
// is returning a day early. This only ever updates the shared bike-
// returns calendar (moving/recoloring that one event); the booking's
// actual due date shown elsewhere on this page (overdue badge, extend
// math, etc.) is never touched.
// REWIRED 2026-08-17 onto the save-pipeline engine -- picker closes
// immediately, write runs in the background, only this row's card shows
// "Saving…" while it's in flight. updateReturnPickup has no clientTxnId
// (it's naturally idempotent already -- see genClientTxnId's own comment
// for exactly which actions do/don't need one).
function confirmEditTime(rowNumber, isoDate, hhmm, deliveryLink) {
  if (bkQueueFull()) { alert('2 saves are already in progress — wait for one to finish before starting another.'); return; }

  openEditTimeRowNumber = null;

  bkEnqueue({
    label: 'Adjust pickup',
    rows: [rowNumber],
    requests: [{ action: 'updateReturnPickup', payload: { rowNumber: rowNumber, returnDate: isoDate, returnTime: hhmm, deliveryLink: deliveryLink } }],
    onAllSuccess: (results) => {
      const result = results[0];
      if (result.warning) alert('Saved, but: ' + result.warning);
      // updateReturnPickup touches this one customer row's return time,
      // confirmed-pickup-date, and (if a link was entered) pickupLink
      // columns -- plus, best-effort, the matching Contract row's own
      // deliveryLink, and the shared calendar event to match -- nothing
      // else shifts, so the on-page list can be updated directly instead
      // of waiting on a full reload of the bikes + customer data.
      const row = (customerRows || []).find(r => r.rowNumber === rowNumber);
      if (row) {
        row.returnTime = hhmm;
        row.confirmedReturnDate = isoToDmy(isoDate);
        // Mirrors both link fields locally so this popup's own prefill
        // (deliveryLink || pickupLink) and QuickView's "🛵 Delivery" link
        // (which reads deliveryLink) both reflect the change immediately,
        // without needing a full reload -- same reasoning as returnTime/
        // confirmedReturnDate just above.
        row.pickupLink = deliveryLink;
        row.deliveryLink = deliveryLink;
      } else {
        // Shouldn't normally happen, but fall back to a full reload rather
        // than leave the list looking out of date if it ever does.
        clearBikesCache(); loadData();
      }
    }
  });
}

// Adds one calendar month to a date, clamping to the last day of the
// target month when the start date doesn't exist there (e.g. Jan 31 + 1
// month lands on Feb 28/29, not Mar 3).
function addOneCalendarMonth(date) {
  const d = new Date(date.getTime());
  const startDay = d.getDate();
  d.setMonth(d.getMonth() + 1);
  if (d.getDate() !== startDay) {
    d.setDate(0);
  }
  return d;
}

function toIsoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// A long extension (1-month checkbox, or 30+ days typed in) doesn't just
// push the due date on the existing booking — it closes that booking out
// (using its current due date, unchanged, as the point it ended) and hands
// off to the Customer Record form to start a brand-new rental record for
// the extension period, prefilled from this booking's details. The
// checkbox takes precedence over the days field if both are given.
// REWIRED 2026-08-17 onto the save-pipeline engine -- picker closes
// immediately, write(s) run in the background, only this row's card
// shows "Saving…" while in flight.
function confirmExtend(rowNumber, daysToExtend, amountPaid, extendMonth, paidBy, paidFromDeposit, depositCategory, depositRow, isDeal) {
  if (bkQueueFull()) { alert('2 saves are already in progress — wait for one to finish before starting another.'); return; }

  const isLongExtension = extendMonth || (daysToExtend >= 30);

  if (isLongExtension) {
    const renter = (customerRows || []).find(r => r.rowNumber === rowNumber);
    if (!renter) {
      alert("Could not find this booking's details — try refreshing the page.");
      return;
    }
    const oldDue = parseFlexibleDate(renter.returnDate);
    if (!oldDue) {
      alert('Could not read the current due date to extend from.');
      return;
    }
    const newReturn = extendMonth
      ? addOneCalendarMonth(oldDue)
      : new Date(oldDue.getTime() + daysToExtend * 86400000);

    // Fallback in case the live auto-fill listeners didn't get a chance to
    // run (e.g. Confirm clicked immediately after ticking the checkbox):
    // price the extension period from the bike's category rate if nothing
    // was entered.
    let finalAmount = amountPaid;
    if (!finalAmount) {
      const autoPrice = computeExtendPrice(renter.bikeModel, extendMonth, daysToExtend);
      if (autoPrice != null) {
        finalAmount = autoPrice;
      } else {
        alert("Couldn't auto-calculate a price for \"" + renter.bikeModel + "\" (no matching category found) — enter the total price by hand in the Amount field above, then hit Confirm again.");
        return;
      }
    }

    // Closes out the old booking, then submits the new period straight
    // through -- the same plain intake action customers.html's own Add
    // form uses (action:'customerIntake', see lib/bikesWrites.js) -- as
    // TWO requests in one queue item, run in strict sequence (see bkRun),
    // same order as before this pass, just backgrounded.
    const payload = {
      contact: renter.contact || '',
      name: renter.name || '',
      nationality: renter.nationality || '',
      passport: renter.passport || '',
      bikeModel: renter.bikeModel || '',
      rentingDateFrom: toIsoDate(oldDue),
      returnDate: toIsoDate(newReturn),
      returnTime: renter.returnTime || '',
      deliverToHotel: renter.deliverToHotel || '',
      totalPrice: String(finalAmount),
      paidBy: paidBy || renter.paidBy || '',
      source: 'extend',
      // Lets the new row's ledger note pick up this booking's full
      // rental history (every prior leg) instead of starting blank --
      // see appendLedgerEntry's isExtendSource branch in Code.gs.
      previousRowNumber: String(rowNumber),
      // Deal (Anton, 20/07/2026) -- only ever sent for a long extension.
      isDeal: !!isDeal,
      // clientTxnId generated once here so a dropped-connection retry (or
      // a page-reload resubmit -- see restoreUnresolvedSaves) of this same
      // request can't book the extension twice -- see customerIntakeFromJson's
      // own comment in lib/bikesWrites.js.
      clientTxnId: genClientTxnId()
    };
    // Cash (Anton, 13/08/2026) has no depositRow to select -- see
    // refreshExtendPaidFromDepositUI -- so it's allowed through here
    // without one; every other category still requires a picked row.
    if (paidFromDeposit && depositCategory && (depositCategory === 'cash' || depositRow)) {
      payload.paidFromDeposit = true;
      payload.depositCategory = depositCategory;
      payload.depositRow = depositCategory === 'cash' ? '' : Number(depositRow);
    }

    extendAmountManuallyEditedRows.delete(rowNumber);
    openExtendRowNumber = null;

    bkEnqueue({
      label: (renter.name ? renter.name + ' — ' : '') + 'Extend (new period)',
      rows: [rowNumber],
      requests: [
        { action: 'closeBikeForExtend', payload: { rowNumber: rowNumber } },
        { action: 'customerIntake', payload }
      ],
      onAllSuccess: (results) => {
        const warnings = [results[0] && results[0].warning, results[1] && results[1].warning].filter(Boolean);
        if (warnings.length) alert('Extended, but: ' + warnings.join(' '));
        // Closes out the old row and creates a brand-new one -- simplest
        // to just reload rather than try to patch the list in place, same
        // as before this pass.
        clearBikesCache(); loadData();
      }
    });
    return;
  }

  // Short extension (under 30 days, checkbox not ticked): simple in-place
  // update, same as before.
  const rr = (customerRows || []).find(r => r.rowNumber === rowNumber);
  openExtendRowNumber = null;

  bkEnqueue({
    label: (rr && rr.name ? rr.name + ' — ' : '') + 'Extend',
    rows: [rowNumber],
    requests: [{
      action: 'extendBike',
      payload: {
        rowNumber: rowNumber, daysToExtend: daysToExtend, amountPaid: amountPaid, paidBy: paidBy,
        paidFromDeposit: paidFromDeposit, depositCategory: depositCategory, depositRow: depositRow,
        // clientTxnId generated once here so a dropped-connection retry (or
        // a page-reload resubmit) of this same request can't double-charge
        // -- see extendBikeRowFromJson's own comment in lib/bikesWrites.js.
        clientTxnId: genClientTxnId()
      }
    }],
    onAllSuccess: (results) => {
      // Post-write verification problems (the server re-reads everything
      // it wrote -- customer row, income row, cash row, bikes/deposit
      // totals -- and compares) come back as a warning: the extension DID
      // save, but something should be checked by hand.
      if (results[0].warning) alert('Extended, but: ' + results[0].warning);
      extendAmountManuallyEditedRows.delete(rowNumber);
      clearBikesCache(); loadData();
    }
  });
}

let swapModalRowNumber = null;   // rowNumber the swap modal is open for
let swapStep = 'edit';           // 'edit' | 'confirm'
let swapDraft = { newBike: '', returnAmount: 0, newBikeAmount: 0 };
let swapError = '';
let swapSaving = false;
let swapMouseDownOnBackdrop = false;
let swapAcHiIndex = -1;          // highlighted index in the New Bike autocomplete dropdown

function fmtMoney(n) {
  const num = Number(n);
  return (isNaN(num) ? 0 : num).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function paidByDisplayName(paidByVal) {
  const v = (paidByVal || '').toString().trim().toLowerCase();
  if (v === 'scan') return 'QR Scan';
  if (v === 'cash') return 'Cash';
  if (v === 'wise') return 'Wise';
  if (v === 'revolut') return 'Revolut';
  return paidByVal || '—';
}

// "Total paid" line for the Rented card -- prefers the Contract sheet's
// running total (contractTotalPrice/contractPaidBy, matched server-side by
// findContractFinancialsForCustomerRow_ in Code.gs), since that's the
// figure that survives swaps/extensions across a customer's whole rental.
// Falls back to this customer-sheet row's own totalPrice/paidBy only when
// no Contract match was found at all (e.g. a customer with no linked
// Contract row) -- better an approximate figure than a blank one.
function renterPaidDisplayHtml(renter) {
  const hasContractTotal = renter.contractTotalPrice !== '' && renter.contractTotalPrice !== undefined && renter.contractTotalPrice !== null;
  const totalPrice = hasContractTotal ? renter.contractTotalPrice : renter.totalPrice;
  const paidBy = hasContractTotal ? renter.contractPaidBy : renter.paidBy;
  const hasTotal = totalPrice !== '' && totalPrice !== undefined && totalPrice !== null && !isNaN(Number(totalPrice));
  const amountText = hasTotal ? ('฿' + fmtMoney(totalPrice)) : '—';
  const methodText = paidBy ? paidByDisplayName(paidBy) : '';
  return '<b>' + amountText + '</b>' + (methodText ? ' (' + methodText + ')' : '');
}

// "Deposit" line for the Rented card -- deposit method + amount only ever
// come from the matched Contract row (the "customer" sheet has no deposit-
// amount column of its own at all), so a miss there just means this shows
// "—". A Passport deposit has no amount to show (see contract.html's
// deposit-amount field, hidden whenever "Passport" is selected), so that
// case is called out by name instead of showing "฿0".
//
// Currency: renter.depositCurrency is blank whenever the deposit is plain
// Thai Baht (the default -- nothing was ever selected on the "Change
// currency" picker on the contract form), in which case this shows the ฿
// symbol as before. Whenever a staff member DID tag the deposit with a
// different currency (e.g. RMB, USD), this shows "<amount> <code>"
// instead -- same convention contract.html's own receipt view uses --
// rather than always showing ฿ regardless of what was actually recorded.
function renterDepositDisplayHtml(renter) {
  const method = (renter.deposit || '').toString().trim();
  if (!method) return '<b>—</b>';
  if (method.toLowerCase() === 'passport') return '<b>Passport</b> (on file)';
  const amount = renter.depositAmount;
  const hasAmount = amount !== '' && amount !== undefined && amount !== null && !isNaN(Number(amount));
  if (!hasAmount) return '<b>' + method + '</b>';
  const currency = (renter.depositCurrency || '').toString().trim();
  const amountText = currency ? (fmtMoney(amount) + ' ' + currency) : ('฿' + fmtMoney(amount));
  return '<b>' + amountText + '</b> (' + method + ')';
}

// Bikes not currently rented (per the same "situation" logic as everywhere
// else on this page), minus the bike being swapped out itself -- swapping a
// bike for itself isn't a real option here.
function getAvailableBikeNames(excludeName) {
  return (bikeNames || []).filter(name => {
    if (bikeNamesMatch(name, excludeName)) return false;
    return !findCurrentRenter(name);
  });
}

// Return Amount = daily rate (original total price / total rental-period
// days) x days used so far. "Days used" counts from the rental's start
// date up to today, with a 2pm cutoff: before 2pm, today doesn't count yet;
// at/after 2pm, it does. Capped to [0, totalDays] so an overdue swap can't
// produce a negative remainder. New Bike Amount is the exact remainder
// (total - returnAmount), not separately rounded, so the two always sum
// back to the original total without rounding drift.
function computeSwapDefaults(renter) {
  const total = Number(renter.totalPrice) || 0;
  const start = parseFlexibleDate(renter.rentingDateFrom);
  const due = parseFlexibleDate(renter.returnDate);

  if (!start || !due) {
    return { returnAmount: 0, newBikeAmount: total, totalDays: null };
  }

  const start0 = new Date(start); start0.setHours(0, 0, 0, 0);
  const due0 = new Date(due); due0.setHours(0, 0, 0, 0);
  const totalDays = Math.max(1, Math.round((due0 - start0) / 86400000));

  const now = new Date();
  const today0 = new Date(now); today0.setHours(0, 0, 0, 0);
  const calendarDaysElapsed = Math.max(0, Math.round((today0 - start0) / 86400000));
  const isAfter2pm = now.getHours() >= 14;
  let daysUsed = calendarDaysElapsed + (isAfter2pm ? 1 : 0);
  daysUsed = Math.min(Math.max(daysUsed, 0), totalDays);

  const dailyRate = total / totalDays;
  const returnAmount = Math.round(dailyRate * daysUsed);
  const newBikeAmount = Math.round((total - returnAmount) * 100) / 100;

  return { returnAmount, newBikeAmount, totalDays, daysUsed };
}

function openSwapModal(rowNumber) {
  const renter = (customerRows || []).find(r => r.rowNumber === rowNumber);
  if (!renter) {
    alert("Could not find this booking's details — try refreshing the page.");
    return;

  const defaults = computeSwapDefaults(renter);
  swapModalRowNumber = rowNumber;
  swapStep = 'edit';
  swapError = '';
  swapSaving = false;
  swapDraft = {
    newBike: '', returnAmount: defaults.returnAmount, newBikeAmount: defaults.newBikeAmount,
    upgradeChecked: false, additionalAmount: 0, additionalPaidBy: ''
  };
  renderSwapModal();
}

function closeSwapModal() {
  swapModalRowNumber = null;

  swapError = '';
  swapSaving = false;
  renderSwapModal();
}

// Same purpose as the Contact Customer feature on oilchange.html, but
// built as a dynamically-injected modal (like Swap Bike above) rather
// than a static hidden <div>, to match this page's existing pattern.
// Just generates a pre-filled message for staff to copy and paste into
// WhatsApp themselves -- no messaging API involved.
//
// {{firstName}} and {{bikeShort}} are the only placeholders used right
// now; {{bikeShort}} uses customerFacingBikeModel() (the Bike Tax tab's
// actual "Model" column, e.g. "NMAX"/"PCX"/"GT") rather than the internal
// sheet name (e.g. "Rax Two" -- an internal nickname staff use, which
// means nothing to a customer) or the old shortBikeName() word-mangling
// -- see customerFacingBikeModel()'s comment below for why.
const CONTACT_MESSAGE_TEMPLATE = `Hi {{firstName}} 🙏, hope you're doing well! Just a quick reminder that your {{bikeShort}} is due back tomorrow. Would you like to return it as planned, or would you prefer to extend the rental? Let us know either way — thanks so much! 🛵`;

// Capitalizes one word of a Bike Tax "Model" value for customer-facing
// text: guarantees the first letter is capitalized, but otherwise leaves
// the rest of the word's casing exactly as typed in the sheet (unlike
// capitalizeBikeName() above, which force-lowercases everything after the
// first letter -- wrong here, since real model names like "NMAX"/"XMAX"
// are meant to stay fully uppercase). GT and PCX are still forced to
// their standard all-caps acronym form regardless of how they're typed,
// via the same ACRONYM_EXCEPTIONS list capitalizeBikeName() uses.
function capitalizeModelWord(word) {
  if (!word) return word;
  const lw = word.toLowerCase();
  if (ACRONYM_EXCEPTIONS.has(lw)) return lw.toUpperCase();
  return word.charAt(0).toUpperCase() + word.slice(1);
}

// Customer-facing bike name for the Contact Customer message: looks up
// the bike's real Model from the Bike Tax tab (categoryRows, same source
// already used for pricing/category lookups on this page) rather than
// trying to shorten the internal sheet name -- staff sometimes name bikes
// internally in ways that mean nothing to a customer (e.g. "Rax Two"),
// and the actual model ("NMAX") is what should go in an outward-facing
// message. Falls back to the old shortBikeName() mangling of the sheet
// name only if this bike can't be found in Bike Tax at all (better than
// showing nothing), and to the raw sheet name if even that comes up
// empty.
function customerFacingBikeModel(bikeName) {
  const match = categoryRows.find(cr => bikeNamesMatch(cr.bike, bikeName));
  const model = match ? (match.model || '').toString().trim() : '';
  if (model) {
    return model.split(/\s+/).map(capitalizeModelWord).join(' ');
  }
  return shortBikeName(bikeName) || bikeName;
}
