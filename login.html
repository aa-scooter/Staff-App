<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AA Scooters</title>
<link rel="icon" href="https://scooterrentalchiangmai.com/wp-content/uploads/2025/02/cropped-cropped-logo-3333-270x270.png">
<link rel="apple-touch-icon" href="https://scooterrentalchiangmai.com/wp-content/uploads/2025/02/cropped-cropped-logo-3333-270x270.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F3D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AA Scooters">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#F5EFE6; --ink:#1A2421; --petrol:#0F3D3E; --cone:#FF6B35;
    --card:#FFFFFF; --line:#DED4C2; --muted:#5A6663; --bad:#C53030;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--petrol);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; color:var(--ink); padding:16px;
  }
  .card{
    background:var(--card); border-radius:16px; padding:32px 28px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .card img{ width:56px; height:auto; margin-bottom:14px; }
  .card h1{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px;
    color:var(--petrol); margin:0 0 6px;
  }
  .card p{ color:var(--muted); font-size:13.5px; margin:0 0 22px; line-height:1.5; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink); font-family:'Inter',sans-serif;
    font-size:14.5px; font-weight:600; cursor:pointer; text-decoration:none;
  }
  .google-btn:active{ transform:scale(.98); }
  .google-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .error-msg{
    margin-top:16px; font-size:12.5px; color:var(--bad);
    background:#FCEBEB; border:1px solid #F3C6C6; border-radius:7px;
    padding:8px 10px; display:none;
  }
  .error-msg.show{ display:block; }
</style>
</head>
<body>

<div class="card">
  <img src="https://scooterrentalchiangmai.com/wp-content/uploads/2025/02/cropped-logo-3333-101x105.png" alt="AA Scooters logo">
  <h1>Staff Access</h1>
  <p>Sign in with the AA Scooters Google account to continue.</p>
  <a class="google-btn" id="googleSignInBtn" href="#">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.6 34.7 27 35.6 24 35.6c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.8 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.5 36.8 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Sign in with Google
  </a>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var next = params.get('next');
  var btn = document.getElementById('googleSignInBtn');
  btn.href = '/api/auth/login' + (next ? '?next=' + encodeURIComponent(next) : '');

  var err = params.get('error');
  if (err) {
    var el = document.getElementById('errorMsg');
    el.textContent = 'Sign-in failed -- please try again.';
    el.classList.add('show');
  }
})();
</script>

</body>
</html>
